    function todayStr() { return new Date().toISOString().slice(0, 10); }
    function daysBetween(a, b) { return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000); }
    function isSeasonActive(t, m) { return !t.months || t.months.length === 0 || t.months.includes(m); }
    function isDue(t, today) { return !t.lastDone || daysBetween(t.lastDone, today) >= t.interval; }
    
    function storageGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } }
    function storageSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }

    function App() {
      const [lang, setLang] = useState(() => storageGet("app-lang") || "cz");
      const [tab, setTab] = useState("dnes");
      const [tasks, setTasks] = useState([]);
      const [inventory, setInventory] = useState([]);
      const [weatherMode, setWeatherMode] = useState("auto");
      const [apiWeather, setApiWeather] = useState({ isRaining: false, temp: 16, wind: 3, loaded: false });
      const [extra, setExtra] = useState([]);
      const [log, setLog] = useState([]);
      const [sessions, setSessions] = useState([]);
      const [selectedAreaFilter, setSelectedAreaFilter] = useState("all");
      const [wageSettings, setWageSettings] = useState({ defaultRate: 300, areaRates: { safran: 300, komunitni: 300, skolni: 300, skola_mp: 320, byty: 350, hrastice: 350, vrchlabi: 350 } });

      const t = I18N[lang];

      useEffect(() => {
        setTasks(storageGet("tasks-catalog") || SEED_TASKS);
        setInventory(storageGet("inventory-data") || SEED_INVENTORY);
        setExtra(storageGet("extra-tasks") || []);
        setLog(storageGet("handover-log") || []);
        setSessions(storageGet("work-sessions") || []);
        const ws = storageGet("wage-settings");
        if (ws) setWageSettings(ws);

        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${TROJA_LAT}&longitude=${TROJA_LON}&current_weather=true`)
          .then(res => res.json())
          .then(data => {
            if (data.current_weather) {
              setApiWeather({
                isRaining: data.current_weather.weathercode >= 51,
                temp: data.current_weather.temperature,
                wind: data.current_weather.windspeed,
                loaded: true
              });
            }
          })
          .catch(err => console.error("API error:", err));
      }, []);

      function changeLang(l) {
        setLang(l);
        storageSet("app-lang", l);
      }

      const today = todayStr();
      const month = new Date().getMonth() + 1;
      const isRainingActive = weatherMode === "rain" ? true : (weatherMode === "dry" ? false : apiWeather.isRaining);

      const filteredTasks = useMemo(() => {
        if (selectedAreaFilter === "all") return tasks;
        return tasks.filter(tk => tk.areas && tk.areas.includes(selectedAreaFilter));
      }, [tasks, selectedAreaFilter]);

      const due = useMemo(() => filteredTasks.filter(tk => isSeasonActive(tk, month) && isDue(tk, today)), [filteredTasks, month, today]);
      
      const sortedDue = useMemo(() => {
        const pMap = { critical: 0, high: 1, medium: 2, low: 3 };
        return [...due].sort((a, b) => (pMap[a.priority || "medium"] - pMap[b.priority || "medium"]));
      }, [due]);

      const dueIndoor = sortedDue.filter(tk => tk.category === "indoor");
      const dueOutdoor = isRainingActive ? [] : sortedDue.filter(tk => tk.category === "outdoor");
      const outdoorBlocked = isRainingActive ? sortedDue.filter(tk => tk.category === "outdoor") : [];

      function toggleTask(id) {
        const updated = tasks.map(tk => tk.id === id ? { ...tk, lastDone: tk.lastDone === today ? null : today } : tk);
        setTasks(updated);
        storageSet("tasks-catalog", updated);
      }

      function addExtra(name) {
        if (!name.trim()) return;
        const updated = [...extra, { id: "e-" + Date.now(), name, done: false, date: today }];
        setExtra(updated);
        storageSet("extra-tasks", updated);
      }

      function toggleExtra(id) {
        const updated = extra.map(ex => ex.id === id ? { ...ex, done: !ex.done } : ex);
        setExtra(updated);
        storageSet("extra-tasks", updated);
      }

      function deleteExtra(id) {
        const updated = extra.filter(ex => ex.id !== id);
        setExtra(updated);
        storageSet("extra-tasks", updated);
      }

      function addTask(newTask) {
        const updated = [...tasks, { ...newTask, id: "t-" + Date.now(), lastDone: null }];
        setTasks(updated);
        storageSet("tasks-catalog", updated);
      }

      function deleteTask(id) {
        const updated = tasks.filter(tk => tk.id !== id);
        setTasks(updated);
        storageSet("tasks-catalog", updated);
      }

      function updateStock(id, delta) {
        const updated = inventory.map(item => item.id === id ? { ...item, stock: Math.max(0, item.stock + delta) } : item);
        setInventory(updated);
        storageSet("inventory-data", updated);
      }

      function addInventoryItem(item) {
        const updated = [...inventory, { ...item, id: "i-" + Date.now() }];
        setInventory(updated);
        storageSet("inventory-data", updated);
      }

      function addLogEntry(text, copyToBacklog = false) {
        if (!text.trim()) return;
        const entry = { id: "l-" + Date.now(), date: today, time: new Date().toLocaleTimeString("cs-CZ", { hour: "2-digit", minute: "2-digit" }), text, author: "Vláďa / Владя" };
        const updatedLog = [entry, ...log];
        setLog(updatedLog);
        storageSet("handover-log", updatedLog);

        if (copyToBacklog) {
          addTask({
            name: { cz: "Závada: " + text.slice(0, 35) + "...", ua: "Несправність: " + text.slice(0, 35) + "..." },
            category: "indoor",
            priority: "high",
            tag: "Revize",
            interval: 1,
            notes: { cz: text, ua: text },
            months: [],
            areas: [selectedAreaFilter === "all" ? "skola_mp" : selectedAreaFilter]
          });
        }
      }

      function startShift(area) {
        if (sessions.some(s => !s.end)) return;
        const updated = [{ id: "s-" + Date.now(), date: today, start: new Date().toISOString(), end: null, area: area || "skola_mp" }, ...sessions];
        setSessions(updated);
        storageSet("work-sessions", updated);
      }

      function endShift() {
        const idx = sessions.findIndex(s => !s.end);
        if (idx < 0) return;
        const now = new Date().toISOString();
        const s = sessions[idx];
        const hours = Math.round(((new Date(now) - new Date(s.start)) / 3600000) * 100) / 100;
        const rate = wageSettings.areaRates[s.area] || wageSettings.defaultRate;
        const updated = sessions.map((x, i) => i === idx ? { ...x, end: now, hours, rate, wage: Math.round(hours * rate) } : x);
        setSessions(updated);
        storageSet("work-sessions", updated);
      }

      function deleteSession(id) {
        const updated = sessions.filter(s => s.id !== id);
        setSessions(updated);
        storageSet("work-sessions", updated);
      }

            ),

            e("div", { className: "flex bg-[#24282C] p-1 rounded-xl border border-[#3A3F44]" },
              e("button", { onClick: () => setWeatherMode("dry"), className: `px-2.5 py-1 rounded-lg text-xs font-bold transition ${weatherMode === "dry" ? "bg-amber-500 text-black shadow" : "text-gray-400"}` }, t.dry),

              e("button", { onClick: () => setWeatherMode("auto"), className: `px-2.5 py-1 rounded-lg text-xs font-bold transition ${weatherMode === "auto" ? "bg-[#F2A93B] text-black shadow" : "text-gray-400"}` }, t.auto)
            )
          )
        ),

        // INFORMACE O POČASÍ
        e("div", { className: `mb-4 p-2.5 rounded-xl text-xs font-semibold flex items-center justify-between border ${isRainingActive ? "bg-red-950/40 border-red-500/60 text-red-200" : "bg-emerald-950/40 border-emerald-500/60 text-emerald-200"}` },

          e("span", { className: "opacity-75 text-[11px]" }, weatherMode === "auto" ? t.sourceApi : t.sourceManual)
        ),

        apiWeather.temp < 18 && e("div", { className: "mb-4 p-3 rounded-xl bg-amber-950/50 border border-amber-500/50 text-amber-300 text-xs" }, t.coldWarning),

        // FILTR OBJEKTŮ
        e("div", { className: "flex items-center gap-2 mb-6 overflow-x-auto pb-2" },
          e("button", {
            onClick: () => setSelectedAreaFilter("all"),

          }, t.allAreas),
          AREAS.map(a => e("button", {

        ),

        // NAVIGAČNÍ TLAČÍTKA
        e("div", { className: "flex gap-1.5 mb-6 bg-[#24282C] p-1.5 rounded-2xl border border-[#3A3F44] overflow-x-auto" },

        tab === "objekty" && e(ObjektyTab, { selectedAreaFilter, lang, t }),
        tab === "sklad" && e(SkladTab, { inventory, onUpdateStock: updateStock, onAddItem: addInventoryItem, selectedAreaFilter, lang, t }),
        tab === "katalog" && e(KatalogTab, { tasks: filteredTasks, onAddTask: addTask, onDeleteTask: deleteTask, lang, t }),
        tab === "protokol" && e(ProtokolTab, { log, onAddLog: addLogEntry, lang, t }),
        tab === "vykaz" && e(VykazTab, { sessions, onStart: startShift, onEnd: endShift, onDelete: deleteSession, wageSettings, setWageSettings, lang, t })
      );

            e("input", { value: name, onChange: e => setName(e.target.value), placeholder: t.itemPlaceholder, className: "w-full px-3 py-2 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm text-white outline-none" }),
            e("div", { className: "flex gap-2" },
              e("select", { value: area, onChange: e => setArea(e.target.value), className: "flex-1 px-3 py-2 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm text-white outline-none" },
                AREAS.map(a => e("option", { key: a.id, value: a.id }, a.label[lang] || a.label.cz))
              ),
              e("input", { value: unit, onChange: e => setUnit(e.target.value), placeholder: t.unitPlaceholder, className: "w-28 px-3 py-2 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm text-white outline-none" })
            ),
            e("div", { className: "flex gap-2" },
              e("input", { type: "number", value: stock, onChange: e => setStock(Number(e.target.value)), placeholder: "Stav", className: "flex-1 px-3 py-2 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm text-white outline-none" }),
              e("input", { type: "number", value: minStock, onChange: e => setMinStock(Number(e.target.value)), placeholder: "Min. stav", className: "flex-1 px-3 py-2 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm text-white outline-none" })
            ),
            e("button", {
              onClick: () => {
                if (name.trim()) {
                  onAddItem({ name: { cz: name, ua: name }, area, stock, minStock, unit });
                  setName("");
                }
              },
              className: "w-full py-2.5 rounded-xl bg-[#F2A93B] text-black font-bold text-sm mt-2"
            }, t.add)
          )
        ),

        e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44]" },
          e("h2", { className: "text-xs font-bold uppercase tracking-wider text-gray-400 mb-3" }, `${t.stockState} (${items.length})`),
          items.map(item => {
            const isLow = item.stock < item.minStock;
            const itemArea = AREAS.find(a => a.id === item.area);
            const itemName = typeof item.name === "object" ? (item.name[lang] || item.name.cz) : item.name;
            return e("div", { key: item.id, className: `flex justify-between items-center p-3 mb-2 rounded-xl border ${isLow ? "bg-red-950/40 border-red-500/80" : "bg-[#2E3338] border-[#3A3F44]"}` },
              e("div", null,
                e("p", { className: "text-sm font-semibold text-gray-100" }, itemName),
                e("p", { className: "text-xs text-gray-400 mt-0.5" }, 
                  `${itemArea ? (itemArea.label[lang] || itemArea.label.cz) : item.area} | Min: ${item.minStock} ${item.unit}`
                ),
                isLow && e("p", { className: "text-[11px] text-red-400 font-bold mt-1" }, t.needBuy)
              ),
              e("div", { className: "flex items-center gap-2" },
                e("button", { onClick: () => onUpdateStock(item.id, -1), className: "w-8 h-8 bg-[#3A3F44] text-white rounded-lg font-bold" }, "-"),
                e("span", { className: "text-sm font-bold min-w-[40px] text-center" }, `${item.stock} ${item.unit}`),
                e("button", { onClick: () => onUpdateStock(item.id, 1), className: "w-8 h-8 bg-[#3A3F44] text-white rounded-lg font-bold" }, "+")
              )
            );
          })
        )
      );
    }

    function KatalogTab({ tasks, onAddTask, onDeleteTask, lang, t }) {
      const [name, setName] = useState("");
      const [cat, setCat] = useState("indoor");
      const [priority, setPriority] = useState("medium");
      const [tag, setTag] = useState("Revize");
      const [interval, setInterval] = useState(7);
      const [notes, setNotes] = useState("");
      const [substitute, setSubstitute] = useState("");
      const [selectedAreas, setSelectedAreas] = useState(["skola_mp"]);

      function toggleAreaSelection(id) {
        if (selectedAreas.includes(id)) setSelectedAreas(selectedAreas.filter(a => a !== id));
        else setSelectedAreas([...selectedAreas, id]);
      }

      return e("div", { className: "space-y-6" },
        e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44]" },
          e("h3", { className: "text-sm font-bold text-[#F2A93B] mb-3 uppercase tracking-wider" }, t.addTaskCatalog),
          e("div", { className: "space-y-3" },
            e("input", { value: name, onChange: e => setName(e.target.value), placeholder: t.taskNamePlaceholder, className: "w-full px-3 py-2 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm text-white outline-none" }),
            e("div", { className: "flex gap-2 flex-wrap" },
              e("select", { value: cat, onChange: e => setCat(e.target.value), className: "flex-1 px-3 py-2 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm text-white outline-none" },
                e("option", { value: "indoor" }, "Vnitřní / Критий"),
                e("option", { value: "outdoor" }, "Venkovní / Зовнішній")
              ),
              e("select", { value: priority, onChange: e => setPriority(e.target.value), className: "flex-1 px-3 py-2 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm text-white outline-none" },
                e("option", { value: "low" }, "Nízká priority"),
                e("option", { value: "medium" }, "Střední priority"),
                e("option", { value: "high" }, "Vysoká priority"),
                e("option", { value: "critical" }, "🔴 Havarijní / Аварійна")
              )
            ),
            e("input", { type: "number", value: interval, onChange: e => setInterval(Number(e.target.value)), placeholder: t.intervalPlaceholder, className: "w-full px-3 py-2 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm text-white outline-none" }),
            cat === "outdoor" && e("input", { value: substitute, onChange: e => setSubstitute(e.target.value), placeholder: t.substitutePlaceholder, className: "w-full px-3 py-2 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm text-amber-300 outline-none" }),
            e("input", { value: notes, onChange: e => setNotes(e.target.value), placeholder: t.notesPlaceholder, className: "w-full px-3 py-2 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm text-white outline-none" }),
            e("button", {
              onClick: () => {
                if (name.trim()) {
                  onAddTask({ name: { cz: name, ua: name }, category: cat, priority, tag, interval, notes: { cz: notes, ua: notes }, substitute: { cz: substitute, ua: substitute }, months: [], areas: selectedAreas });
                  setName(""); setNotes(""); setSubstitute("");
                }
              },
              className: "w-full py-2.5 rounded-xl bg-[#F2A93B] text-black font-bold text-sm mt-2"
            }, t.saveCatalog)
          )
        ),

        e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44]" },
          e("h2", { className: "text-xs font-bold uppercase tracking-wider text-gray-400 mb-3" }, `${t.catalogTitle} (${tasks.length})`),
          tasks.map(tk => {
            const taskName = typeof tk.name === "object" ? (tk.name[lang] || tk.name.cz) : tk.name;
            return e("div", { key: tk.id, className: "flex justify-between items-start p-3 mb-2 rounded-xl bg-[#2E3338] border border-[#3A3F44]" },
              e("div", null,
                e("p", { className: "text-sm font-semibold text-gray-100" }, taskName),
                e("p", { className: "text-xs text-gray-400 mt-0.5" }, `Interval: ${tk.interval} d`)
              ),
              e("button", { onClick: () => onDeleteTask(tk.id), className: "text-gray-500 hover:text-red-400 text-xs px-2 py-1" }, t.delete)
            );
          })
        )
      );
    }

    function ProtokolTab({ log, onAddLog, lang, t }) {
      const [text, setText] = useState("");
      return e("div", { className: "space-y-6" },
        e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44]" },
          e("h2", { className: "text-xs font-bold uppercase tracking-wider text-[#F2A93B] mb-2" }, t.logTitle),
          e("textarea", {
            value: text,
            onChange: e => setText(e.target.value),
            placeholder: t.logPlaceholder,
            className: "w-full p-3 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm text-white outline-none h-28 mb-3"
          }),
          e("div", { className: "flex gap-2" },
            e("button", { onClick: () => { onAddLog(text, false); setText(""); }, className: "flex-1 py-2.5 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-gray-200 font-bold text-xs" }, t.saveLog),
            e("button", { onClick: () => { onAddLog(text, true); setText(""); }, className: "flex-1 py-2.5 rounded-xl bg-[#F2A93B] text-black font-bold text-xs" }, t.saveLogBacklog)
          )
        ),

        e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44]" },
          e("h2", { className: "text-xs font-bold uppercase tracking-wider text-gray-400 mb-3" }, t.logHistory),
          log.map(l => e("div", { key: l.id, className: "p-3 mb-2 rounded-xl bg-[#2E3338] border border-[#3A3F44]" },
            e("div", { className: "flex justify-between text-xs text-gray-400 mb-1" },
              e("span", { className: "font-bold text-[#F2A93B]" }, l.author),
              e("span", null, `${l.date} ${l.time}`)
            ),
            e("p", { className: "text-sm text-gray-200 whitespace-pre-line" }, l.text)
          ))
        )
      );
    }

    function VykazTab({ sessions, onStart, onEnd, onDelete, wageSettings, lang, t }) {
      const [selectedArea, setSelectedArea] = useState("skola_mp");
      const active = sessions.find(s => !s.end);

      const breakdownByArea = useMemo(() => {
        const result = {};
        AREAS.forEach(a => { result[a.id] = { hours: 0, wage: 0, label: a.label[lang] || a.label.cz, color: a.color }; });
        sessions.forEach(s => {
          if (s.end && s.area && result[s.area]) {
            result[s.area].hours += (s.hours || 0);
            result[s.area].wage += (s.wage || 0);
          }
        });
        return result;
      }, [sessions, lang]);

      const totalWage = sessions.reduce((acc, s) => acc + (s.wage || 0), 0);
      const totalHours = Math.round(sessions.reduce((acc, s) => acc + (s.hours || 0), 0) * 100) / 100;

      return e("div", { className: "space-y-6" },
        e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44] text-center" },
          active ? e("div", { className: "space-y-3" },
            e("p", { className: "text-sm text-green-400 font-bold" }, `${t.shiftRunning} (${new Date(active.start).toLocaleTimeString("cs-CZ", { hour: "2-digit", minute: "2-digit" })})`),
            e("button", { onClick: onEnd, className: "w-full py-3 rounded-xl bg-red-500 text-white font-bold text-sm shadow-lg" }, t.endShift)
          ) : e("div", { className: "space-y-3" },
            e("p", { className: "text-xs font-bold text-gray-400 uppercase" }, t.selectObject),
            e("select", { value: selectedArea, onChange: e => setSelectedArea(e.target.value), className: "w-full p-2.5 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm text-white outline-none" },
              AREAS.map(a => e("option", { key: a.id, value: a.id }, a.label[lang] || a.label.cz))
            ),
            e("button", { onClick: () => onStart(selectedArea), className: "w-full py-3 rounded-xl bg-[#F2A93B] text-black font-bold text-sm shadow-lg" }, t.startShift)
          )
        ),

        e("div", { className: "grid grid-cols-2 gap-4" },
          e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44] text-center" },
            e("p", { className: "text-xs text-gray-400 uppercase font-bold" }, t.totalWorked),
            e("p", { className: "text-2xl font-bold text-[#F2A93B] mt-1" }, `${totalHours} h`)
          ),
          e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44] text-center" },
            e("p", { className: "text-xs text-gray-400 uppercase font-bold" }, t.totalWage),
            e("p", { className: "text-2xl font-bold text-green-400 mt-1" }, `${totalWage} Kč`)
          )
        ),

        e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44]" },
          e("h2", { className: "text-xs font-bold uppercase tracking-wider text-[#F2A93B] mb-3" }, t.monthlyClosure),
          Object.keys(breakdownByArea).map(areaId => {
            const item = breakdownByArea[areaId];
            return e("div", { key: areaId, className: "flex justify-between items-center p-2.5 mb-1.5 bg-[#2E3338] rounded-xl border border-[#3A3F44]" },
              e("div", { className: "flex items-center gap-2" },
                e("div", { className: "w-3 h-3 rounded-full", style: { backgroundColor: item.color } }),
                e("span", { className: "text-xs font-semibold text-gray-200" }, item.label)
              ),
              e("div", { className: "text-right text-xs" },
                e("span", { className: "text-gray-400 mr-3" }, `${Math.round(item.hours * 10) / 10} h`),
                e("span", { className: "font-bold text-green-400" }, `${item.wage} Kč`)
              )
            );
          })
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
