<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Provozní deník údržby</title>
  
  <!-- Tailwind CSS pro stylování -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#1B1E21] text-[#ECECEA]">
  <div id="root"></div>

  <script>
    const { useState, useEffect, useMemo, createElement: e } = React;

    // Barvy
    const C = {
      bg: "#1B1E21", panel: "#24282C", panelAlt: "#2E3338", border: "#3A3F44",
      amber: "#F2A93B", green: "#5FB77E", red: "#E2694B", text: "#ECECEA", muted: "#9AA0A6"
    };

    const SEED_TASKS = [
      { id: "v1", name: "Větrání teepee / jurty", category: "indoor", months: [3, 4, 5, 6, 7, 8], interval: 1, notes: "KOM a Školní prostor", lastDone: null },
      { id: "v2", name: "Zalévání záhonů a keřů", category: "outdoor", months: [3, 4, 5, 6, 7, 8], interval: 3, notes: "Šafrán, KOM, Školní", lastDone: null },
      { id: "v3", name: "Sekání trávy", category: "outdoor", months: [3, 4, 5, 9, 10, 11], interval: 14, notes: "Všechny exteriéry", lastDone: null }
    ];

    function todayStr() { return new Date().toISOString().slice(0, 10); }
    function daysBetween(a, b) { return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000); }
    function isDue(task, today) { return !task.lastDone || daysBetween(task.lastDone, today) >= task.interval; }

    function storageGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } }
    function storageSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }

    function App() {
      const [tasks, setTasks] = useState([]);
      const [weather, setWeather] = useState({ date: todayStr(), isRaining: false });
      const [extra, setExtra] = useState([]);
      const [newExtraText, setNewExtraText] = useState("");

      useEffect(() => {
        setTasks(storageGet("tasks-catalog") || SEED_TASKS);
        setWeather(storageGet("weather-state") || { date: todayStr(), isRaining: false });
        setExtra(storageGet("extra-tasks") || []);
      }, []);

      const today = todayStr();
      const month = new Date().getMonth() + 1;

      const due = useMemo(() => tasks.filter(t => (!t.months.length || t.months.includes(month)) && isDue(t, today)), [tasks, month, today]);
      const dueIndoor = due.filter(t => t.category === "indoor");
      const dueOutdoor = weather.isRaining ? [] : due.filter(t => t.category === "outdoor");
      const outdoorBlocked = weather.isRaining ? due.filter(t => t.category === "outdoor") : [];

      function toggleTask(id) {
        const updated = tasks.map(t => t.id === id ? { ...t, lastDone: t.lastDone === today ? null : today } : t);
        setTasks(updated);
        storageSet("tasks-catalog", updated);
      }

      function toggleRain() {
        const next = { date: today, isRaining: !weather.isRaining };
        setWeather(next);
        storageSet("weather-state", next);
      }

      function addExtra() {
        if (!newExtraText.trim()) return;
        const updated = [...extra, { id: "e-" + Date.now(), name: newExtraText, done: false }];
        setExtra(updated);
        storageSet("extra-tasks", updated);
        setNewExtraText("");
      }

      function toggleExtra(id) {
        const updated = extra.map(e => e.id === id ? { ...e, done: !e.done } : e);
        setExtra(updated);
        storageSet("extra-tasks", updated);
      }

      return e("div", { className: "max-w-xl mx-auto p-4 font-sans" },
        // Hlavička
        e("div", { className: "flex justify-between items-center mb-6" },
          e("h1", { className: "text-xl font-bold uppercase text-[#F2A93B]" }, "Provozní deník údržby"),
          e("button", { onClick: toggleRain, className: "px-3 py-1.5 rounded-lg border text-sm font-semibold flex items-center gap-2", style: { borderColor: weather.isRaining ? C.red : C.border, color: weather.isRaining ? C.red : C.text } },
            weather.isRaining ? "🌧️ Dnes prší" : "☀️ Dnes je sucho"
          )
        ),

        // Varování při dešti
        outdoorBlocked.length > 0 && e("div", { className: "p-3 rounded-xl mb-4 bg-red-900/20 border border-red-500/30 text-red-400 text-sm" },
          `Odloženo kvůli dešti: ${outdoorBlocked.map(t => t.name).join(", ")}`
        ),

        // Vnitřní úkoly
        e("div", { className: "mb-6" },
          e("h2", { className: "text-sm font-semibold mb-2 text-gray-400 uppercase tracking-wider" }, "Vnitřní úkoly"),
          dueIndoor.map(t => e("div", { key: t.id, onClick: () => toggleTask(t.id), className: "flex items-center gap-3 p-3 mb-2 rounded-xl bg-[#24282C] border border-[#3A3F44] cursor-pointer" },
            e("span", null, t.lastDone === today ? "✅" : "⚪"),
            e("span", { className: t.lastDone === today ? "line-through text-gray-500" : "" }, t.name)
          ))
        ),

        // Venkovní úkoly
        e("div", { className: "mb-6" },
          e("h2", { className: "text-sm font-semibold mb-2 text-gray-400 uppercase tracking-wider" }, "Venkovní úkoly"),
          dueOutdoor.map(t => e("div", { key: t.id, onClick: () => toggleTask(t.id), className: "flex items-center gap-3 p-3 mb-2 rounded-xl bg-[#24282C] border border-[#3A3F44] cursor-pointer" },
            e("span", null, t.lastDone === today ? "✅" : "⚪"),
            e("span", { className: t.lastDone === today ? "line-through text-gray-500" : "" }, t.name)
          ))
        ),

        // Mimořádné úkoly
        e("div", null,
          e("h2", { className: "text-sm font-semibold mb-2 text-gray-400 uppercase tracking-wider" }, "Mimořádné úkoly"),
          extra.map(ex => e("div", { key: ex.id, onClick: () => toggleExtra(ex.id), className: "flex items-center gap-3 p-3 mb-2 rounded-xl bg-[#24282C] border border-[#3A3F44] cursor-pointer" },
            e("span", null, ex.done ? "✅" : "⚪"),
            e("span", { className: ex.done ? "line-through text-gray-500" : "" }, ex.name)
          )),
          e("div", { className: "flex gap-2 mt-3" },
            e("input", {
              value: newExtraText,
              onChange: (evt) => setNewExtraText(evt.target.value),
              placeholder: "Přidat úkol…",
              className: "flex-1 px-3 py-2 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm outline-none"
            }),
            e("button", { onClick: addExtra, className: "px-4 py-2 rounded-xl bg-[#F2A93B] text-black font-semibold text-sm" }, "+")
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
