        if (!error && data) {
          const mapped = data.map(item => ({
            id: item.id,
            name: { cz: item.title, ua: item.title },
            status: item.status,
            priority: item.priority === 'Kritická' ? 'critical' : item.priority === 'Vysoká' ? 'high' : 'medium',
            category: 'indoor',
            areas: ['skola_mp'],
            lastDone: item.status === 'Done' ? today : null,
            notes: { cz: item.description || '', ua: item.description || '' }
          }));
          setExtra(mapped);
        }
      };

      useEffect(() => {
        fetchCloudTasks();

        const channel = supabase
          .channel('schema-db-changes')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, () => {
            fetchCloudTasks();
          })
          .subscribe();

        return () => { supabase.removeChannel(channel); };
      }, []);

      useEffect(() => {
        if (weatherMode === "auto") {
          fetch(`https://api.open-meteo.com/v1/forecast?latitude=${TROJA_LAT}&longitude=${TROJA_LON}&current_weather=true`)
            .then(res => res.json())
            .then(data => {
              if (data && data.current_weather) {
                const code = data.current_weather.weathercode;
                const isRain = [51,53,55,61,63,65,80,81,82,95,96,97].includes(code);
                setApiWeather({
                  isRaining: isRain,
                  temp: Math.round(data.current_weather.temperature),
                  wind: Math.round(data.current_weather.windspeed)
                });
              }
            }).catch(() => {});
        }
      }, [weatherMode]);

      const effectiveRaining = weatherMode === "rain" ? true : weatherMode === "dry" ? false : apiWeather.isRaining;

      const addExtraCloud = async (title) => {
        if (!title.trim()) return;
        const { error } = await supabase.from('tasks').insert([
          { title: title, status: 'Backlog', is_adhoc: true, priority: 'Normal' }
        ]);
        if (error) console.error("Chyba zápisu do Supabase:", error);
      };

      const toggleExtraCloud = async (id, currentStatus) => {
        const nextStatus = currentStatus === 'Done' ? 'Backlog' : 'Done';
        await supabase.from('tasks').update({ status: nextStatus }).eq('id', id);
      };

      const deleteExtraCloud = async (id) => {
        await supabase.from('tasks').delete().eq('id', id);
      };

      const toggleTaskDone = (id) => {
        setTasks(prev => prev.map(tk => {
          if (tk.id === id) {
            const isDoneToday = tk.lastDone === today;
            return { ...tk, lastDone: isDoneToday ? null : today };
          }
          return tk;
        }));
      };

      const addCatalogTask = (newTask) => {
        setTasks(prev => [newTask, ...prev]);
      };

      const startShift = (areaId) => {
        setActiveSession({ areaId, startTime: new Date().toISOString() });
      };

      const endShift = () => {
        if (!activeSession) return;
        const end = new Date();
        const start = new Date(activeSession.startTime);
        const durationHours = Math.max(0.05, ((end - start) / (1000 * 60 * 60))).toFixed(2);
        const newSession = {
          id: Date.now().toString(),
          date: today,
          areaId: activeSession.areaId,
          hours: parseFloat(durationHours),
          wage: Math.round(parseFloat(durationHours) * 250)
        };
        setWorkSessions([newSession, ...workSessions]);
        setActiveSession(null);
      };

      return e("div", { className: "min-h-screen bg-[#1B1E21] text-[#ECECEA] p-4 sm:p-8 font-sans w-full max-w-none" },
        // HLAVIČKA A NÁSTROJE
        e("div", { className: "flex flex-wrap justify-between items-center gap-4 mb-4 border-b border-[#3A3F44] pb-4 w-full" },
          e("div", null,
            e("h1", { className: "text-2xl font-bold uppercase tracking-wide text-[#F2A93B]" }, t.title),
            e("p", { className: "text-xs text-emerald-400 mt-0.5" }, "● Cloud Supabase Realtime Aktivní")
          ),
          e("div", { className: "flex gap-2 items-center flex-wrap" },
            // PREPYNAC POCASI
            e("div", { className: "flex bg-[#24282C] p-1 rounded-xl border border-[#3A3F44] text-xs font-semibold" },
              e("button", { onClick: () => setWeatherMode("dry"), className: `px-3 py-1 rounded-lg ${weatherMode === "dry" ? "bg-amber-500 text-black font-bold" : "text-gray-400"}` }, t.dry),
              e("button", { onClick: () => setWeatherMode("rain"), className: `px-3 py-1 rounded-lg ${weatherMode === "rain" ? "bg-blue-600 text-white font-bold" : "text-gray-400"}` }, t.rain),
              e("button", { onClick: () => setWeatherMode("auto"), className: `px-3 py-1 rounded-lg ${weatherMode === "auto" ? "bg-emerald-600 text-white font-bold" : "text-gray-400"}` }, t.auto)
            ),
            // PŘEPÍNAČ JAZYKA
            e("div", { className: "flex bg-[#24282C] p-1 rounded-xl border border-[#3A3F44]" },
              e("button", { onClick: () => setLang("cz"), className: `px-2.5 py-1 rounded-lg text-xs font-bold ${lang === "cz" ? "bg-[#F2A93B] text-black" : "text-gray-400"}` }, "🇨🇿 CZ"),
              e("button", { onClick: () => setLang("ua"), className: `px-2.5 py-1 rounded-lg text-xs font-bold ${lang === "ua" ? "bg-blue-600 text-white" : "text-gray-400"}` }, "🇺🇦 UA")
            )
          )
        ),

        // STAV POČASÍ BANNER
        e("div", { className: `p-3 rounded-xl border mb-6 flex items-center justify-between text-xs font-bold ${effectiveRaining ? "bg-blue-950/40 border-blue-500/50 text-blue-200" : "bg-amber-950/20 border-amber-500/40 text-amber-200"}` },
          e("span", null, effectiveRaining ? t.rainActive : t.dryActive),
          e("span", { className: "opacity-75 font-normal" }, `${weatherMode === "auto" ? t.sourceApi : t.sourceManual} (${apiWeather.temp}°C, ${apiWeather.wind} km/h)`)
        ),

        // FILTER OBJEKTŮ
        e("div", { className: "flex gap-2 mb-6 overflow-x-auto pb-2 w-full" },
          e("button", {
            onClick: () => setSelectedAreaFilter("all"),
            className: `px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition ${selectedAreaFilter === "all" ? "bg-white text-black" : "bg-[#24282C] text-gray-400 border border-[#3A3F44]"}`
          }, t.allAreas),
          AREAS.map(a => e("button", {
            key: a.id,
            onClick: () => setSelectedAreaFilter(a.id),
            className: `px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition ${selectedAreaFilter === a.id ? "text-black" : "bg-[#24282C] text-gray-300 border border-[#3A3F44]"}`,
            style: selectedAreaFilter === a.id ? { backgroundColor: a.color } : {}
          }, a.label[lang]))
        ),

        // HLAVNÍ TAB NAVIGACE
        e("div", { className: "flex gap-1.5 mb-6 bg-[#24282C] p-1.5 rounded-2xl border border-[#3A3F44] overflow-x-auto w-full" },
          [
            { id: "dnes", label: t.tabDnes },
            { id: "harmonogram", label: t.tabHarmonogram },
            { id: "objekty", label: t.tabObjekty },
            { id: "sklad", label: t.tabSklad },
            { id: "katalog", label: t.tabKatalog },
            { id: "vykaz", label: t.tabVykaz },
            { id: "protokol", label: t.tabProtokol }
          ].map(tb => e("button", {
            key: tb.id,
            onClick: () => setTab(tb.id),
            className: `flex-1 min-w-[120px] py-2.5 rounded-xl text-xs font-bold transition text-center ${tab === tb.id ? "bg-[#F2A93B] text-black shadow-md" : "text-gray-400 hover:text-white"}`
          }, tb.label))
        ),

        // OBSAH JEDNOTLIVÝCH ZÁLOŽEK
        tab === "dnes" && e(DnesTab, { 
          tasks, 
          onToggleTaskDone, 
          extra, 
          onAddExtra: addExtraCloud, 
          onToggleExtra: toggleExtraCloud, 
          onDeleteExtra: deleteExtraCloud, 
          effectiveRaining, 
          selectedAreaFilter, 
          t, 
          lang 
        }),
        
        tab === "harmonogram" && e(HarmonogramTab, { t, lang, selectedAreaFilter }),
        
        tab === "objekty" && e(ObjektyTab, { t, lang, selectedAreaFilter }),
        
        tab === "sklad" && e(SkladTab, { inventory, setInventory, t, lang, selectedAreaFilter }),
        
        tab === "katalog" && e(KatalogTab, { tasks, onAddTask: addCatalogTask, t, lang }),
        
        tab === "vykaz" && e(VykazTab, { 
          workSessions, 
          activeSession, 
          startShift, 
          endShift, 
          t, 
          lang, 
          selectedAreaFilter 
        }),
        
        tab === "protokol" && e(ProtokolTab, { logs, setLogs, onAddExtraCloud, t, lang })
      );
    }

    // ZÁLOŽKA 1: DNES A ÚKOLY
    function DnesTab({ tasks, onToggleTaskDone, extra, onAddExtra, onToggleExtra, onDeleteExtra, effectiveRaining, selectedAreaFilter, t, lang }) {

          e("div", { className: "flex gap-2 mt-4" },

              onChange: e => setText(e.target.value),
              onKeyDown: e => { if (e.key === "Enter") { onAddExtra(text); setText(""); } },

          )

        // SYSTEMOVÉ ÚKOLY
        e("div", { className: "grid grid-cols-1 md:grid-cols-2 gap-4 w-full" },

          e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44]" },

            filteredTasks.filter(k => k.category === "indoor").map(tk => {

              return e("div", { key: tk.id, className: "p-3 mb-2 rounded-xl bg-[#2E3338] border border-[#3A3F44] flex items-start gap-3 cursor-pointer", onClick: () => onToggleTaskDone(tk.id) },
                e("span", { className: "text-lg mt-0.5" }, isDone ? "✅" : "⚪"),
                e("div", null,
                  e("div", { className: `font-bold text-sm ${isDone ? "line-through text-gray-500" : "text-white"}` }, tk.name[lang]),
                  e("div", { className: "text-xs text-gray-400 mt-0.5" }, tk.notes[lang])
                )
              );
            })
          ),
          // VENKOVNI ÚKOLY
          e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44]" },
            e("h3", { className: "text-xs font-bold uppercase text-amber-400 mb-3" }, t.outdoorTasks),
            filteredTasks.filter(k => k.category === "outdoor").map(tk => {
              const isDone = tk.lastDone === today;
              return e("div", { key: tk.id, className: `p-3 mb-2 rounded-xl border ${effectiveRaining ? "bg-red-950/20 border-red-500/30 opacity-85" : "bg-[#2E3338] border-[#3A3F44]"}` },
                e("div", { className: "flex items-start gap-3 cursor-pointer", onClick: () => onToggleTaskDone(tk.id) },
                  e("span", { className: "text-lg mt-0.5" }, isDone ? "✅" : "⚪"),
                  e("div", null,
                    e("div", { className: `font-bold text-sm ${isDone ? "line-through text-gray-500" : "text-white"}` }, tk.name[lang]),
                    e("div", { className: "text-xs text-gray-400 mt-0.5" }, tk.notes[lang])
                  )
                ),
                effectiveRaining && tk.substitute && e("div", { className: "text-xs text-amber-300 mt-2 p-2 bg-amber-950/40 rounded-lg border border-amber-500/30 ml-7" },
                  `${t.substituteLabel} ${tk.substitute[lang]}`
                )
              );
            })
          )
        )
      );

    // ZÁLOŽKA 6: VÝKAZ A UZÁVĚRKA
    function VykazTab({ workSessions, activeSession, startShift, endShift, t, lang, selectedAreaFilter }) {
      const [selectedArea, setSelectedArea] = useState(AREAS[0].id);

      const filteredSessions = workSessions.filter(s => selectedAreaFilter === "all" || s.areaId === selectedAreaFilter);
      const totalHours = filteredSessions.reduce((acc, s) => acc + s.hours, 0);
      const totalPay = filteredSessions.reduce((acc, s) => acc + s.wage, 0);

      return e("div", { className: "space-y-6 w-full" },
        // MĚŘENÍ ČASU
        e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44]" },
          activeSession ? e("div", { className: "flex items-center justify-between" },
            e("div", null,
              e("span", { className: "text-xs text-emerald-400 font-bold block" }, t.shiftRunning),
              e("span", { className: "text-sm font-bold text-white" }, AREAS.find(a => a.id === activeSession.areaId)?.label[lang])
            ),
            e("button", { onClick: endShift, className: "px-4 py-2 rounded-xl bg-red-600 text-white font-bold text-sm" }, t.endShift)
          ) : e("div", { className: "flex flex-wrap items-center gap-3" },
            e("span", { className: "text-xs text-gray-300 font-bold" }, t.selectObject),
            e("select", { value: selectedArea, onChange: e => setSelectedArea(e.target.value), className: "px-3 py-2 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm text-white outline-none" },
              AREAS.map(a => e("option", { key: a.id, value: a.id }, a.label[lang]))
            ),
            e("button", { onClick: () => startShift(selectedArea), className: "px-4 py-2 rounded-xl bg-emerald-600 text-white font-bold text-sm" }, t.startShift)
          )
        ),

        // SOUHRN
        e("div", { className: "grid grid-cols-2 gap-4" },
          e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44]" },
            e("span", { className: "text-xs text-gray-400 block" }, t.totalWorked),
            e("span", { className: "text-xl font-bold font-mono text-[#F2A93B]" }, `${totalHours.toFixed(2)} hod`)
          ),
          e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44]" },
            e("span", { className: "text-xs text-gray-400 block" }, t.totalWage),
            e("span", { className: "text-xl font-bold font-mono text-emerald-400" }, `${totalPay} Kč`)
          )
        ),

        // HISTORIE SMĚN
        e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44]" },
          e("h3", { className: "text-xs font-bold uppercase text-gray-400 mb-3" }, t.shiftHistory),
          filteredSessions.length === 0 ? e("p", { className: "text-xs text-gray-500 italic" }, t.noSessions) :
          filteredSessions.map(s => e("div", { key: s.id, className: "flex items-center justify-between p-3 mb-2 rounded-xl bg-[#2E3338] border border-[#3A3F44]" },
            e("div", null,
              e("span", { className: "text-xs text-gray-400 block" }, s.date),
              e("span", { className: "text-sm font-bold text-white" }, AREAS.find(a => a.id === s.areaId)?.label[lang])
            ),
            e("div", { className: "text-right" },
              e("span", { className: "text-sm font-mono text-amber-400 block" }, `${s.hours} hod`),
              e("span", { className: "text-xs font-mono text-emerald-400" }, `${s.wage} Kč`)
            )
          ))
        )
      );
    }

    // ZÁLOŽKA 7: PROTOKOL / HLÁŠENÍ
    function ProtokolTab({ logs, setLogs, onAddExtraCloud, t, lang }) {
      const [text, setText] = useState("");

      const addLog = (toBacklog = false) => {
        if (!text.trim()) return;
        const newLog = { id: Date.now().toString(), date: todayStr(), text };
        setLogs([newLog, ...logs]);
        
        if (toBacklog && onAddExtraCloud) {
          onAddExtraCloud(`[ZÁVADA] ${text}`);
        }
        setText("");
      };

      return e("div", { className: "space-y-6 w-full" },
        e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44]" },
          e("h3", { className: "text-xs font-bold uppercase text-[#F2A93B] mb-3" }, t.logTitle),
          e("textarea", {
            value: text,
            onChange: e => setText(e.target.value),
            placeholder: t.logPlaceholder,
            className: "w-full p-3 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm text-white outline-none h-24 mb-3"
          }),
          e("div", { className: "flex gap-2" },
            e("button", { onClick: () => addLog(false), className: "px-4 py-2 rounded-xl bg-[#F2A93B] text-black font-bold text-sm" }, t.saveLog),
            e("button", { onClick: () => addLog(true), className: "px-4 py-2 rounded-xl bg-red-600 text-white font-bold text-sm" }, t.saveLogBacklog)
          )
        ),
        e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44]" },
          e("h3", { className: "text-xs font-bold uppercase text-gray-400 mb-3" }, t.logHistory),
          logs.length === 0 ? e("p", { className: "text-xs text-gray-500 italic" }, "Zatím žádná hlášení.") :
          logs.map(l => e("div", { key: l.id, className: "p-3 mb-2 rounded-xl bg-[#2E3338] border border-[#3A3F44]" },
            e("span", { className: "text-xs text-[#F2A93B] font-mono block mb-1" }, l.date),
            e("p", { className: "text-sm text-gray-200" }, l.text)
          ))
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
