<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Provozní deník údržby</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
</head>
<body class="bg-[#1B1E21] text-[#ECECEA] antialiased">
  <div id="root"></div>

  <script>
    const { useState, useEffect, useMemo, createElement: e } = React;

    // ---------- Styl & Konfigurace ----------
    const C = {
      bg: "#1B1E21", panel: "#24282C", panelAlt: "#2E3338", border: "#3A3F44",
      amber: "#F2A93B", green: "#5FB77E", red: "#E2694B", text: "#ECECEA", muted: "#9AA0A6"
    };

    const AREAS = [
      { id: "safran", label: "Šafrán", color: "#8B5FBF" },
      { id: "komunitni", label: "Komunitní prostor", color: "#3B5BA5" },
      { id: "skolni", label: "Školní prostor", color: "#2E8B7D" },
      { id: "byty", label: "Byty", color: "#6B6B6B" },
      { id: "hrastice", label: "Chata Hraštice", color: "#C24B4B" },
      { id: "vrchlabi", label: "Vrchlabí 172", color: "#9A8B3F" }
    ];

    const ROLES = [
      { id: "spravce", label: "Správce", color: "#6FA8DC" },
      { id: "udrzbar", label: "Údržbář / zahradník", color: "#5FB77E" },
      { id: "mistr", label: "Mistr", color: "#F2A93B" },
      { id: "tvurce", label: "Tvůrce / řemeslník", color: "#B388EB" },
      { id: "manzel", label: "Hodinový manžel", color: "#E07A5F" },
      { id: "pohotovost", label: "Pohotovost", color: "#C24B4B" }
    ];

    const SEED_SCHEDULE = [
      { id: "r1", label: "Ranní kontrolní kolečko", role: "spravce", days: [1,2,3,4,5,6,7], months: [], timeStart: "06:00", timeEnd: "06:30", areas: ["safran", "komunitni", "skolni"], note: "Odemčení/uzamčení, rychlá kontrola objektů." },
      { id: "r2", label: "Sezónní údržba zahrady a exteriéru", role: "udrzbar", days: [2,4,6], months: [3,4,5,9,10,11], timeStart: "08:00", timeEnd: "12:00", areas: ["safran", "komunitni", "skolni"], note: "Jaro/podzim: sekání, hrabání, úklid." },
      { id: "r3", label: "Letní údržba a zálivka", role: "udrzbar", days: [1,3,5], months: [6,7,8], timeStart: "07:00", timeEnd: "10:00", areas: ["safran", "komunitni", "skolni"], note: "Zálivka záhonů, sekání trávy, drobné opravy." },
      { id: "r4", label: "Zimní provoz a topení", role: "udrzbar", days: [1,2,3,4,5,6,7], months: [12,1,2], timeStart: "06:30", timeEnd: "08:00", areas: ["safran", "komunitni", "skolni"], note: "Zátop, kontrola topení, sníh a posyp." }
    ];

    const SEED_TASKS = [
      { id: "v1", name: "Větrání teepee / jurty", category: "indoor", areas: ["komunitni", "skolni"], months: [3, 4, 5, 6, 7, 8], interval: 1, notes: "Konkrétně: KOM prostor; Školní prostor, Jurta", lastDone: null },
      { id: "v2", name: "Zalévání záhonů, květin, stromků, keřů", category: "outdoor", areas: ["safran", "komunitni", "skolni"], months: [3, 4, 5, 6, 7, 8], interval: 3, notes: "Šafrán exteriér, KOM, Školní prostor", lastDone: null },
      { id: "v3", name: "Sekání trávy", category: "outdoor", areas: ["safran", "komunitni", "skolni", "hrastice"], months: [3, 4, 5, 9, 10, 11], interval: 14, notes: "Šafrán, KOM, Školní prostor", lastDone: null },
      { id: "v4", name: "Odzimování, úklid po zimě (hrabání, hnojení)", category: "indoor", areas: ["safran", "komunitni", "skolni", "hrastice"], months: [3, 4, 5], interval: 90, notes: "Jarní úklid pozemku", lastDone: null },
      { id: "v5", name: "Kontrola stavu po zimě + soupis potřebných oprav", category: "indoor", areas: ["safran", "komunitni", "skolni", "hrastice"], months: [3, 4, 5], interval: 90, notes: "Výstup jde do backlogu oprav", lastDone: null },
      { id: "v6", name: "Otevření a kontrola venkovní vody, napojení hadic", category: "outdoor", areas: ["safran", "komunitni", "skolni", "hrastice"], months: [3, 4, 5], interval: 90, notes: "Předletní příprava vody", lastDone: null },
      { id: "v7", name: "Kontrola nářadí a vybavení", category: "indoor", areas: ["safran", "komunitni", "skolni", "hrastice"], months: [3, 4, 5], interval: 90, notes: "Revize funkčnosti strojů a nářadí", lastDone: null },
      { id: "v8", name: "Kontrola hřiště a herních prvků po zimě", category: "outdoor", areas: ["safran", "skolni"], months: [3, 4, 5], interval: 90, notes: "Bezpečnostní kontrola prvků", lastDone: null },
      { id: "v9", name: "Kontrola a čištění okapů", category: "outdoor", areas: ["safran", "komunitni", "skolni", "hrastice"], months: [], interval: 90, notes: "Domek, Nová chata, Altán, Maringotka, Jurta", lastDone: null },
      { id: "v10", name: "Sazba trávy a doplňování osiva", category: "outdoor", areas: ["safran", "komunitni", "skolni"], months: [3, 4, 5], interval: 14, notes: "Úprava lysin v trávníku", lastDone: null },
      { id: "v11", name: "Kontrola funkčnosti osvětlení v areálu", category: "indoor", areas: ["safran", "komunitni", "skolni"], months: [], interval: 30, notes: "Výměna prasklých žárovek", lastDone: null },
      { id: "v12", name: "Prořezávání stromů a keřů", category: "outdoor", areas: ["safran", "komunitni", "hrastice"], months: [3, 4, 10, 11], interval: 182, notes: "Sezónní řez", lastDone: null },
      { id: "v13", name: "Kontrola topného systému a stavu paliva", category: "indoor", areas: ["safran", "komunitni", "skolni", "byty"], months: [9, 10, 11, 12, 1, 2], interval: 7, notes: "Dřevo, pelety, kontrola kotle", lastDone: null },
      { id: "v14", name: "Zazimování venkovní vody a vypuštění trubek", category: "outdoor", areas: ["safran", "komunitni", "skolni", "hrastice"], months: [10, 11], interval: 365, notes: "Ochrana před mrazem", lastDone: null },
      { id: "v15", name: "Pravidelný generální úklid dílny", category: "indoor", areas: ["safran"], months: [], interval: 30, notes: "Třídění materiálu, úklid stolů", lastDone: null }
    ];

    // ---------- Pomocné funkce ----------
    function todayStr() { return new Date().toISOString().slice(0, 10); }
    function daysBetween(a, b) { return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000); }
    function isSeasonActive(t, m) { return !t.months || t.months.length === 0 || t.months.includes(m); }
    function isDue(t, today) { return !t.lastDone || daysBetween(t.lastDone, today) >= t.interval; }
    
    function storageGet(k) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } catch(e) { return null; } }
    function storageSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }

    // ---------- Hlavní Aplikace ----------
    function App() {
      const [tab, setTab] = useState("dnes");
      const [tasks, setTasks] = useState([]);
      const [weather, setWeather] = useState({ date: todayStr(), isRaining: false });
      const [extra, setExtra] = useState([]);
      const [log, setLog] = useState([]);
      const [sessions, setSessions] = useState([]);
      const [wageSettings, setWageSettings] = useState({ defaultRate: 300, areaRates: {} });

      useEffect(() => {
        setTasks(storageGet("tasks-catalog") || SEED_TASKS);
        setWeather(storageGet("weather-state") || { date: todayStr(), isRaining: false });
        setExtra(storageGet("extra-tasks") || []);
        setLog(storageGet("handover-log") || []);
        setSessions(storageGet("work-sessions") || []);
        setWageSettings(storageGet("wage-settings") || { defaultRate: 300, areaRates: {} });
      }, []);

      const today = todayStr();
      const month = new Date().getMonth() + 1;

      const due = useMemo(() => tasks.filter(t => isSeasonActive(t, month) && isDue(t, today)), [tasks, month, today]);
      const dueIndoor = due.filter(t => t.category === "indoor");
      const dueOutdoor = weather.isRaining ? [] : due.filter(t => t.category === "outdoor");
      const outdoorBlocked = weather.isRaining ? due.filter(t => t.category === "outdoor") : [];

      function toggleTask(id) {
        const updated = tasks.map(t => t.id === id ? { ...t, lastDone: t.lastDone === today ? null : today } : t);
        setTasks(updated);
        storageSet("tasks-catalog", updated);
      }

      function toggleRain() {
        const next = { date: today, isRaining: !weather.isRaining };
        setWeather(next);
        storageSet("weather-state", next);
      }

      function addExtra(name) {
        if (!name.trim()) return;
        const updated = [...extra, { id: "e-" + Date.now(), name, done: false }];
        setExtra(updated);
        storageSet("extra-tasks", updated);
      }

      function toggleExtra(id) {
        const updated = extra.map(e => e.id === id ? { ...e, done: !e.done } : e);
        setExtra(updated);
        storageSet("extra-tasks", updated);
      }

      function deleteExtra(id) {
        const updated = extra.filter(e => e.id !== id);
        setExtra(updated);
        storageSet("extra-tasks", updated);
      }

      function addTask(newTask) {
        const updated = [...tasks, { ...newTask, id: "t-" + Date.now(), lastDone: null }];
        setTasks(updated);
        storageSet("tasks-catalog", updated);
      }

      function deleteTask(id) {
        const updated = tasks.filter(t => t.id !== id);
        setTasks(updated);
        storageSet("tasks-catalog", updated);
      }

      function addLogEntry(text) {
        if (!text.trim()) return;
        const entry = { id: "l-" + Date.now(), date: today, time: new Date().toLocaleTimeString("cs-CZ", { hour: "2-digit", minute: "2-digit" }), text };
        const updated = [entry, ...log];
        setLog(updated);
        storageSet("handover-log", updated);
      }

      function startShift(area) {
        if (sessions.some(s => !s.end)) return;
        const updated = [{ id: "s-" + Date.now(), date: today, start: new Date().toISOString(), end: null, area: area || "safran" }, ...sessions];
        setSessions(updated);
        storageSet("work-sessions", updated);
      }

      function endShift() {
        const idx = sessions.findIndex(s => !s.end);
        if (idx < 0) return;
        const now = new Date().toISOString();
        const s = sessions[idx];
        const hours = Math.round(((new Date(now) - new Date(s.start)) / 3600000) * 100) / 100;
        const rate = wageSettings.areaRates[s.area] || wageSettings.defaultRate;
        const updated = sessions.map((x, i) => i === idx ? { ...x, end: now, hours, rate, wage: Math.round(hours * rate) } : x);
        setSessions(updated);
        storageSet("work-sessions", updated);
      }

      function deleteSession(id) {
        const updated = sessions.filter(s => s.id !== id);
        setSessions(updated);
        storageSet("work-sessions", updated);
      }

      return e("div", { className: "max-w-2xl mx-auto p-4 sm:p-6" },
        // Hlavička
        e("div", { className: "flex justify-between items-center mb-6 flex-wrap gap-2" },
          e("div", null,
            e("h1", { className: "text-2xl font-bold uppercase text-[#F2A93B]" }, "Provozní deník údržby"),
            e("p", { className: "text-sm text-gray-400 capitalize" }, new Intl.DateTimeFormat("cs-CZ", { weekday: "long", day: "numeric", month: "long" }).format(new Date()))
          ),
          e("button", { onClick: toggleRain, className: `px-4 py-2 rounded-xl text-sm font-semibold border flex items-center gap-2 ${weather.isRaining ? "bg-red-900/30 border-red-500 text-red-400" : "bg-[#2E3338] border-[#3A3F44] text-gray-200"}` },
            weather.isRaining ? "🌧️ Dnes prší" : "☀️ Dnes je sucho"
          )
        ),

        // Záložky navigační menu
        e("div", { className: "flex gap-2 mb-6 border-b border-[#3A3F44] pb-3 overflow-x-auto" },
          [
            { id: "dnes", label: "Dnes" },
            { id: "katalog", label: "Katalog" },
            { id: "vykaz", label: "Výkaz práce" },
            { id: "protokol", label: "Protokol" }
          ].map(t => e("button", {
            key: t.id,
            onClick: () => setTab(t.id),
            className: `px-4 py-2 rounded-xl text-sm font-semibold transition ${tab === t.id ? "bg-[#F2A93B] text-black" : "text-gray-400 hover:bg-[#2E3338]"}`
          }, t.label))
        ),

        // OBSAH ZÁLOŽEK
        tab === "dnes" && e(DnesView, { dueIndoor, dueOutdoor, outdoorBlocked, extra, onToggleTask: toggleTask, onAddExtra: addExtra, onToggleExtra: toggleExtra, onDeleteExtra: deleteExtra, today }),
        tab === "katalog" && e(KatalogView, { tasks, onAddTask: addTask, onDeleteTask: deleteTask }),
        tab === "protokol" && e(ProtokolView, { log, onAddLog: addLogEntry }),
        tab === "vykaz" && e(VykazView, { sessions, onStart: startShift, onEnd: endShift, onDelete: deleteSession, wageSettings, setWageSettings })
      );
    }

    // ---------- Komponenty Záložek ----------
    function DnesView({ dueIndoor, dueOutdoor, outdoorBlocked, extra, onToggleTask, onAddExtra, onToggleExtra, onDeleteExtra, today }) {
      const [text, setText] = useState("");
      return e("div", { className: "space-y-6" },
        outdoorBlocked.length > 0 && e("div", { className: "p-4 rounded-xl bg-red-900/20 border border-red-500/40 text-red-400 text-sm" },
          e("p", { className: "font-semibold mb-1" }, `Odloženo kvůli dešti (${outdoorBlocked.length})`),
          outdoorBlocked.map(t => e("p", { key: t.id, className: "text-xs opacity-80" }, `• ${t.name}`))
        ),

        e("div", null,
          e("h2", { className: "text-xs font-bold uppercase tracking-wider text-gray-400 mb-3" }, `Vnitřní úkoly (${dueIndoor.length})`),
          dueIndoor.length === 0 ? e("p", { className: "text-sm text-gray-500 italic" }, "Žádné plánované vnitřní úkoly na dnes.") :
          dueIndoor.map(t => e("div", { key: t.id, onClick: () => onToggleTask(t.id), className: "flex items-start gap-3 p-3 mb-2 rounded-xl bg-[#24282C] border border-[#3A3F44] cursor-pointer" },
            e("span", { className: "text-lg" }, t.lastDone === today ? "✅" : "⚪"),
            e("div", { className: "flex-1" },
              e("p", { className: `text-sm font-medium ${t.lastDone === today ? "line-through text-gray-500" : ""}` }, t.name),
              t.notes && e("p", { className: "text-xs text-gray-400 mt-0.5" }, t.notes)
            )
          ))
        ),

        e("div", null,
          e("h2", { className: "text-xs font-bold uppercase tracking-wider text-gray-400 mb-3" }, `Venkovní úkoly (${dueOutdoor.length})`),
          dueOutdoor.length === 0 ? e("p", { className: "text-sm text-gray-500 italic" }, "Žádné venkovní úkoly k provedení.") :
          dueOutdoor.map(t => e("div", { key: t.id, onClick: () => onToggleTask(t.id), className: "flex items-start gap-3 p-3 mb-2 rounded-xl bg-[#24282C] border border-[#3A3F44] cursor-pointer" },
            e("span", { className: "text-lg" }, t.lastDone === today ? "✅" : "⚪"),
            e("div", { className: "flex-1" },
              e("p", { className: `text-sm font-medium ${t.lastDone === today ? "line-through text-gray-500" : ""}` }, t.name),
              t.notes && e("p", { className: "text-xs text-gray-400 mt-0.5" }, t.notes)
            )
          ))
        ),

        e("div", null,
          e("h2", { className: "text-xs font-bold uppercase tracking-wider text-gray-400 mb-3" }, "Mimořádné úkoly"),
          extra.map(ex => e("div", { key: ex.id, className: "flex items-center gap-3 p-3 mb-2 rounded-xl bg-[#24282C] border border-[#3A3F44]" },
            e("button", { onClick: () => onToggleExtra(ex.id) }, ex.done ? "✅" : "⚪"),
            e("span", { className: `flex-1 text-sm ${ex.done ? "line-through text-gray-500" : ""}` }, ex.name),
            e("button", { onClick: () => onDeleteExtra(ex.id), className: "text-gray-500 hover:text-red-400 text-xs px-2 py-1" }, "Smazat")
          )),
          e("div", { className: "flex gap-2 mt-3" },
            e("input", {
              value: text,
              onChange: e => setText(e.target.value),
              onKeyDown: e => { if (e.key === "Enter") { onAddExtra(text); setText(""); } },
              placeholder: "Přidat rychlý úkol…",
              className: "flex-1 px-3 py-2 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm outline-none"
            }),
            e("button", { onClick: () => { onAddExtra(text); setText(""); }, className: "px-4 py-2 rounded-xl bg-[#F2A93B] text-black font-semibold text-sm" }, "Přidat")
          )
        )
      );
    }

    function KatalogView({ tasks, onAddTask, onDeleteTask }) {
      const [name, setName] = useState("");
      const [cat, setCat] = useState("indoor");
      const [interval, setInterval] = useState(7);
      const [notes, setNotes] = useState("");

      return e("div", { className: "space-y-6" },
        e("div", { className: "p-4 rounded-xl bg-[#24282C] border border-[#3A3F44]" },
          e("h3", { className: "text-sm font-bold text-[#F2A93B] mb-3" }, "Přidat nový úkol do katalogu"),
          e("div", { className: "space-y-3" },
            e("input", { value: name, onChange: e => setName(e.target.value), placeholder: "Název úkolu", className: "w-full px-3 py-2 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm outline-none" }),
            e("div", { className: "flex gap-2" },
              e("select", { value: cat, onChange: e => setCat(e.target.value), className: "flex-1 px-3 py-2 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm outline-none" },
                e("option", { value: "indoor" }, "Vnitřní"),
                e("option", { value: "outdoor" }, "Venkovní")
              ),
              e("input", { type: "number", value: interval, onChange: e => setInterval(Number(e.target.value)), placeholder: "Interval (dní)", className: "w-1/3 px-3 py-2 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm outline-none" })
            ),
            e("input", { value: notes, onChange: e => setNotes(e.target.value), placeholder: "Poznámka / Upřesnění", className: "w-full px-3 py-2 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm outline-none" }),
            e("button", {
              onClick: () => {
                if (name.trim()) {
                  onAddTask({ name, category: cat, interval, notes, months: [], areas: [] });
                  setName(""); setNotes("");
                }
              },
              className: "w-full py-2.5 rounded-xl bg-[#F2A93B] text-black font-semibold text-sm"
            }, "Uložit úkol")
          )
        ),

        e("div", null,
          e("h2", { className: "text-xs font-bold uppercase tracking-wider text-gray-400 mb-3" }, `Všechny úkoly (${tasks.length})`),
          tasks.map(t => e("div", { key: t.id, className: "flex justify-between items-start p-3 mb-2 rounded-xl bg-[#24282C] border border-[#3A3F44]" },
            e("div", null,
              e("p", { className: "text-sm font-medium" }, t.name),
              e("p", { className: "text-xs text-gray-400" }, `Opakování: co ${t.interval} dní | ${t.category === "indoor" ? "Vnitřní" : "Venkovní"}`),
              t.notes && e("p", { className: "text-xs text-gray-500 mt-0.5" }, t.notes)
            ),
            e("button", { onClick: () => onDeleteTask(t.id), className: "text-gray-500 hover:text-red-400 text-xs p-1" }, "Smazat")
          ))
        )
      );
    }

    function ProtokolView({ log, onAddLog }) {
      const [text, setText] = useState("");
      return e("div", { className: "space-y-4" },
        e("div", { className: "flex gap-2" },
          e("textarea", {
            value: text,
            onChange: e => setText(e.target.value),
            placeholder: "Zapsat poznámku z dnešní směny / stav objektu…",
            className: "flex-1 p-3 rounded-xl bg-[#24282C] border border-[#3A3F44] text-sm outline-none h-24"
          })
        ),
        e("button", {
          onClick: () => { onAddLog(text); setText(""); },
          className: "px-4 py-2 rounded-xl bg-[#F2A93B] text-black font-semibold text-sm w-full"
        }, "Uložit zápis do deníku"),

        e("div", { className: "pt-4" },
          e("h2", { className: "text-xs font-bold uppercase tracking-wider text-gray-400 mb-3" }, "Historie záznamů"),
          log.length === 0 ? e("p", { className: "text-sm text-gray-500 italic" }, "Zatím žádné zápisy.") :
          log.map(l => e("div", { key: l.id, className: "p-3 mb-2 rounded-xl bg-[#24282C] border border-[#3A3F44]" },
            e("div", { className: "flex justify-between text-xs text-gray-400 mb-1" },
              e("span", { className: "font-bold text-[#F2A93B]" }, "Údržbář"),
              e("span", null, `${l.date} v ${l.time}`)
            ),
            e("p", { className: "text-sm text-gray-200 whitespace-pre-line" }, l.text)
          ))
        )
      );
    }

    function VykazView({ sessions, onStart, onEnd, onDelete, wageSettings, setWageSettings }) {
      const [selectedArea, setSelectedArea] = useState("safran");
      const active = sessions.find(s => !s.end);
      const totalWage = sessions.reduce((acc, s) => acc + (s.wage || 0), 0);
      const totalHours = Math.round(sessions.reduce((acc, s) => acc + (s.hours || 0), 0) * 100) / 100;

      return e("div", { className: "space-y-6" },
        // Ovládání směny
        e("div", { className: "p-4 rounded-xl bg-[#24282C] border border-[#3A3F44] text-center" },
          active ? e("div", { className: "space-y-3" },
            e("p", { className: "text-sm text-green-400 font-semibold" }, `⏱️ Probíhá směna od ${new Date(active.start).toLocaleTimeString("cs-CZ", { hour: "2-digit", minute: "2-digit" })}`),
            e("button", { onClick: onEnd, className: "w-full py-3 rounded-xl bg-red-500 text-white font-bold text-sm" }, "Ukončit směnu")
          ) : e("div", { className: "space-y-3" },
            e("select", { value: selectedArea, onChange: e => setSelectedArea(e.target.value), className: "w-full p-2.5 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm outline-none mb-2" },
              AREAS.map(a => e("option", { key: a.id, value: a.id }, a.label))
            ),
            e("button", { onClick: () => onStart(selectedArea), className: "w-full py-3 rounded-xl bg-[#F2A93B] text-black font-bold text-sm" }, "Začít novou směnu")
          )
        ),

        // Celkový přehled
        e("div", { className: "grid grid-cols-2 gap-3" },
          e("div", { className: "p-3 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-center" },
            e("p", { className: "text-xs text-gray-400" }, "Odpracováno celkem"),
            e("p", { className: "text-lg font-bold text-[#F2A93B]" }, `${totalHours} hod`)
          ),
          e("div", { className: "p-3 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-center" },
            e("p", { className: "text-xs text-gray-400" }, "Celková odměna"),
            e("p", { className: "text-lg font-bold text-green-400" }, `${totalWage} Kč`)
          )
        ),

        // Výpis směn
        e("div", null,
          e("h2", { className: "text-xs font-bold uppercase tracking-wider text-gray-400 mb-3" }, "Výkaz odpracovaných směn"),
          sessions.map(s => e("div", { key: s.id, className: "flex justify-between items-center p-3 mb-2 rounded-xl bg-[#24282C] border border-[#3A3F44]" },
            e("div", null,
              e("p", { className: "text-sm font-semibold" }, `${s.date} ${s.end ? "" : "(probíhá)"}`),
              e("p", { className: "text-xs text-gray-400" }, `Objekt: ${(AREAS.find(a=>a.id===s.area)||{}).label || s.area}`),
              s.hours && e("p", { className: "text-xs text-green-400" }, `${s.hours} h × ${s.rate} Kč = ${s.wage} Kč`)
            ),
            s.end && e("button", { onClick: () => onDelete(s.id), className: "text-gray-500 hover:text-red-400 text-xs px-2" }, "Smazat")
          ))
        )
      );
    }

    // Inicializace Reactu
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
