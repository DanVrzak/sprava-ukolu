<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="script"></script>
</head>
<body class="bg-[#1B1E21] text-[#ECECEA] antialiased">
  <div id="root"></div>

  <script>
    const { useState, useEffect, useMemo, createElement: e } = React;

    const TROJA_LAT = 50.1162;
    const TROJA_LON = 14.4175;

    const AREAS = [
      { id: "safran", label: "Šafrán", color: "#8B5FBF", keys: "Schránka u vjezdu (Kód: 4821)", shutoffs: "Hlavní uzávěr vody: Vlkovská ul., skříňka u plotu. Jističe: Chodba vedle dílny.", emergency: "Havarijní voda: 608 111 222 | Elektro: 800 22 55 88" },
      { id: "komunitni", label: "Komunitní prostor", color: "#3B5BA5", keys: "Klíče v dílně Šafrán na věšáku A2", shutoffs: "Voda: Šachta u brány. Jističe: Skříň u vchodu.", emergency: "Havarijní správa: 777 000 111" },
      { id: "skolni", label: "Školní prostor", color: "#2E8B7D", keys: "Kódový zámek Jurta (Kód: 1234)", shutoffs: "Hlavní vypínač elektro: Mobilheim u dveří. Voda: Pod dřezem v jurtě.", emergency: "Havarijní topení: 602 333 444" },
      { id: "skola_mp", label: "Škola Malého prince", color: "#E67E22", keys: "Kódový box u vchodu do dílen (Kód: 7788), klíč školníka", shutoffs: "Voda: Suterén u schodiště. Elektro: Hlavní rozvaděč v kabinetu dílen.", emergency: "Správa objektu: 733 444 555 | Pohotovost: 608 999 000" },
      { id: "byty", label: "Byty", color: "#6B6B6B", keys: "Generální klíč u správce", shutoffs: "Voda/Plyn: Stoupačky v mezipatře. Jističe: Chodbová skříň v bytě.", emergency: "Plynoservis: 1239 | Pohotovost BD: 731 555 666" },
      { id: "hrastice", label: "Chata Hraštice", color: "#C24B4B", keys: "Trezor na klíče u verandy (Kód: 9081)", shutoffs: "Voda: Šachta na zahradě (klíč v kůlně). Hlavní jistič: Veranda u dveří.", emergency: "Lokální instalatér Hraštice: 604 888 999" },
      { id: "vrchlabi", label: "Vrchlabí 172", color: "#9A8B3F", keys: "Kódový box u hlavních dveří (Kód: 5544)", shutoffs: "Uzávěr vody: Sklep pod schody. Kotel/Plyn: Technická místnost 1.P.", emergency: "Horský servis kotlů Vrchlabí: 775 222 333" }
    ];

    const SEED_TASKS = [
      // ŠKOČNÍK & DÍLNY - ŠKOLA MALÉHO PRINCE
      { id: "smp1", name: "Škola MP: Ranní odblokování vstupů & kontrola trasy dětí", role: "skolnik", category: "outdoor", priority: "high", tag: "Revize", areas: ["skola_mp"], months: [], interval: 1, notes: "Kontrola chodníků, odstranění skla/větví, odemknutí brány do 7:30.", substitute: "Kontrola těsnosti oken a svítidel na chodbách", lastDone: null },
      { id: "smp2", name: "Škola MP: Kontrola TZB, topení & větrání učeben", role: "skolnik", category: "indoor", priority: "high", tag: "Topení", areas: ["skola_mp"], months: [], interval: 1, notes: "Zajištění komfortní teploty před začátkem výuky.", lastDone: null },
      { id: "smp3", name: "Škola MP: Kontrola sociálních zařízení & doplňování hygieny", role: "skolnik", category: "indoor", priority: "medium", tag: "Voda/Instalatérství", areas: ["skola_mp"], months: [], interval: 1, notes: "Doplnění mýdel, ručníků, kontrola úniků vody na WC.", lastDone: null },
      { id: "smp4", name: "Dílna MP: Údržba nářadí (broušení dlátek, kontrola pil)", role: "lektor", category: "indoor", priority: "high", tag: "Revize", areas: ["skola_mp"], months: [], interval: 7, notes: "Broušení ručního nářadí, kontrola přívodních kabelů elektrického nářadí.", lastDone: null },
      { id: "smp5", name: "Dílna MP: Čištění odsávání pilin & odprášení dílny", role: "lektor", category: "indoor", priority: "critical", tag: "Elektro", areas: ["skola_mp"], months: [], interval: 3, notes: "Prevence požáru a prašnosti. Vyprázdnění sběrných vaků odsávání.", lastDone: null },
      { id: "smp6", name: "Dílna MP: Příprava dřevěného materiálu pro výuku", role: "lektor", category: "indoor", priority: "medium", tag: "Stavební", areas: ["skola_mp"], months: [], interval: 7, notes: "Formátování prken, hranolků a překližek pro dětské projekty (planetky B612, letadla).", lastDone: null },
      { id: "smp7", name: "Škola MP: Test hlásičů kouře & kontroly únikových cest", role: "skolnik", category: "indoor", priority: "critical", tag: "Revize", areas: ["skola_mp"], months: [], interval: 30, notes: "Zkouška čidel a prověření volného průchodu k únikovým východům.", lastDone: null },
      { id: "smp8", name: "Škola MP: Kontrola a dotažení školního nábytku", role: "skolnik", category: "indoor", priority: "low", tag: "Stavební", areas: ["skola_mp"], months: [], interval: 14, notes: "Dotažení šroubů lavic, židlí a tabulí v učebnách.", lastDone: null },

      // PŮVODNÍ ÚKOLY OSTATNÍCH OBJEKTŮ
      { id: "v7", name: "Dílna Šafrán: Údržba techniky (sekačky, křovinořezy)", role: "udrzbar", category: "indoor", priority: "medium", tag: "Zahrada", areas: ["safran"], months: [], interval: 30, notes: "Kontrola oleje, svíček, nabití aku baterií, broušení nožů.", lastDone: null },
      { id: "s1", name: "Šafrán: Kontrola a čištění lapačů tuku a odpadů", role: "udrzbar", category: "indoor", priority: "high", tag: "Voda/Instalatérství", areas: ["safran"], months: [], interval: 60, notes: "Kontrola průchodnosti syfonů, výměna filtrů a sanace odpadů.", lastDone: null },
      { id: "v1_kom", name: "Komunitní pr.: Větrání & kontrola vlhkosti", role: "udrzbar", category: "indoor", priority: "low", tag: "Revize", areas: ["komunitni"], months: [3, 4, 5, 6, 7, 8, 9, 10], interval: 1, notes: "Pravidelné větrání, kontrola plísní v rohách.", lastDone: null },
      { id: "v2_kom", name: "Komunitní pr.: Údržba venkovního posezení & ohniště", role: "udrzbar", category: "outdoor", priority: "low", tag: "Zahrada", areas: ["komunitni"], months: [4, 5, 6, 7, 8, 9, 10], interval: 14, notes: "Čištění ohniště, kontrola laviček (dotažení šroubů, nátěr).", substitute: "Úklid a reorganizace nářadí pod střechou", lastDone: null },
      { id: "v1_heat", name: "Školní pr.: Ranní zátop v jurtě a mobilheimu (<18°C)", role: "udrzbar", category: "indoor", priority: "high", tag: "Topení", areas: ["skolni"], months: [9, 10, 11, 12, 1, 2, 3, 4], interval: 1, notes: "Zatopit před příchodem dětí do 7:30.", lastDone: null },
      { id: "v5", name: "Školní pr.: Zátěžová zkouška herních prvků", role: "udrzbar", category: "outdoor", priority: "critical", tag: "Stavební", areas: ["skolni"], months: [], interval: 7, notes: "Zkouška vlastní vahou, doplňování kačírku/štěpky pod průlezkami.", substitute: "Kontrola těsnosti oken a dveří v jurtě", lastDone: null },
      { id: "b1", name: "Byty: Odečty vodoměrů & měřičů tepla", role: "udrzbar", category: "indoor", priority: "medium", tag: "Revize", areas: ["byty"], months: [], interval: 30, notes: "Kopie stavu spotřeby vody a tepla na konci měsíce.", lastDone: null },
      { id: "b2", name: "Byty: Kontrola těsnosti ventilů a WC", role: "udrzbar", category: "indoor", priority: "high", tag: "Voda/Instalatérství", areas: ["byty"], months: [], interval: 90, notes: "Preventivní prohlídka proti protékání záchodů a rohových ventilů.", lastDone: null },
      { id: "b3", name: "Byty: Test hlásičů kouře a CO čidel", role: "udrzbar", category: "indoor", priority: "critical", tag: "Elektro", areas: ["byty"], months: [], interval: 180, notes: "Test baterií v detektorech kouře a plynu v bytech.", lastDone: null },
      { id: "h1", name: "Hraštice: Kontrola a prořez stromů u střechy", role: "udrzbar", category: "outdoor", priority: "medium", tag: "Zahrada", areas: ["hrastice"], months: [3, 4, 10, 11], interval: 180, notes: "Odstranění větví zasahujících do střechy nebo drátů napětí.", substitute: "Údržba motorové pily v dílně", lastDone: null },
      { id: "h2", name: "Hraštice: Kontrola septiku & jímky", role: "udrzbar", category: "outdoor", priority: "high", tag: "Voda/Instalatérství", areas: ["hrastice"], months: [], interval: 30, notes: "Kontrola hladiny naplnění a funkčnosti čerpadla.", substitute: "Kontrola vnitřních rozvodů vody na chatě", lastDone: null },
      { id: "vr1", name: "Vrchlabí: Kontrola střechy a žlabů", role: "udrzbar", category: "outdoor", priority: "high", tag: "Stavební", areas: ["vrchlabi"], months: [9, 10, 11], interval: 90, notes: "Čištění žlabů od listí před zimou a kontrola upevnění sněhových háků.", substitute: "Kontrola a čištění filtru kotle ve sklepě", lastDone: null },
      { id: "vr2", name: "Vrchlabí: Revize a kontrola kotle", role: "udrzbar", category: "indoor", priority: "critical", tag: "Topení", areas: ["vrchlabi"], months: [8, 9], interval: 365, notes: "Servisní prohlídka kotle, odvzdušnění radiátorů v celém objektu.", lastDone: null }
    ];

    const SEED_INVENTORY = [
      { id: "i0", name: "Lipové dřevo (přířezy pro dílny)", area: "skola_mp", stock: 15, minStock: 5, unit: "ks" },
      { id: "i0b", name: "Brusný papír P120/P240", area: "skola_mp", stock: 8, minStock: 10, unit: "balení" },
      { id: "i1", name: "Posypová sůl (25kg pytel)", area: "vrchlabi", stock: 1, minStock: 3, unit: "pytel" },
      { id: "i2", name: "Motorový olej 10W-40 (4T)", area: "safran", stock: 2, minStock: 1, unit: "litr" },
      { id: "i3", name: "Baterie CR2032 (Čidla CO/Kouř)", area: "byty", stock: 2, minStock: 5, unit: "ks" },
      { id: "i4", name: "Palivové dřevo (bříza/smrk)", area: "hrastice", stock: 4, minStock: 2, unit: "m³" },
      { id: "i5", name: "Náhradní žací struna 2.4mm", area: "safran", stock: 1, minStock: 2, unit: "balení" }
    ];

    function todayStr() { return new Date().toISOString().slice(0, 10); }
    function daysBetween(a, b) { return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000); }
    function isSeasonActive(t, m) { return !t.months || t.months.length === 0 || t.months.includes(m); }
    function isDue(t, today) { return !t.lastDone || daysBetween(t.lastDone, today) >= t.interval; }
    
    function storageGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } }
    function storageSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }

    function App() {
      const [tab, setTab] = useState("dnes");
      const [tasks, setTasks] = useState([]);
      const [inventory, setInventory] = useState([]);
      const [weatherMode, setWeatherMode] = useState("auto");
      const [apiWeather, setApiWeather] = useState({ isRaining: false, temp: 16, wind: 3, loaded: false });
      const [extra, setExtra] = useState([]);
      const [log, setLog] = useState([]);
      const [sessions, setSessions] = useState([]);
      const [selectedAreaFilter, setSelectedAreaFilter] = useState("all");
      const [wageSettings, setWageSettings] = useState({ defaultRate: 300, areaRates: { safran: 300, komunitni: 300, skolni: 300, skola_mp: 320, byty: 350, hrastice: 350, vrchlabi: 350 } });

      useEffect(() => {
        setTasks(storageGet("tasks-catalog") || SEED_TASKS);
        setInventory(storageGet("inventory-data") || SEED_INVENTORY);
        setExtra(storageGet("extra-tasks") || []);
        setLog(storageGet("handover-log") || []);
        setSessions(storageGet("work-sessions") || []);
        const ws = storageGet("wage-settings");
        if (ws) setWageSettings(ws);

        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${TROJA_LAT}&longitude=${TROJA_LON}&current_weather=true`)
          .then(res => res.json())
          .then(data => {
            if (data.current_weather) {
              const code = data.current_weather.weathercode;
              setApiWeather({
                isRaining: code >= 51,
                temp: data.current_weather.temperature,
                wind: data.current_weather.windspeed,
                loaded: true
              });
            }
          })
          .catch(err => console.error("Chyba při načítání meteo API:", err));
      }, []);

      const today = todayStr();
      const month = new Date().getMonth() + 1;
      const isRainingActive = weatherMode === "rain" ? true : (weatherMode === "dry" ? false : apiWeather.isRaining);

      const filteredTasks = useMemo(() => {
        if (selectedAreaFilter === "all") return tasks;
        return tasks.filter(t => t.areas && t.areas.includes(selectedAreaFilter));
      }, [tasks, selectedAreaFilter]);

      const due = useMemo(() => filteredTasks.filter(t => isSeasonActive(t, month) && isDue(t, today)), [filteredTasks, month, today]);
      
      const sortedDue = useMemo(() => {
        const pMap = { critical: 0, high: 1, medium: 2, low: 3 };
        return [...due].sort((a, b) => (pMap[a.priority || "medium"] - pMap[b.priority || "medium"]));
      }, [due]);

      const dueIndoor = sortedDue.filter(t => t.category === "indoor");
      const dueOutdoor = isRainingActive ? [] : sortedDue.filter(t => t.category === "outdoor");
      const outdoorBlocked = isRainingActive ? sortedDue.filter(t => t.category === "outdoor") : [];

      function toggleTask(id) {
        const updated = tasks.map(t => t.id === id ? { ...t, lastDone: t.lastDone === today ? null : today } : t);
        setTasks(updated);
        storageSet("tasks-catalog", updated);
      }

      function addExtra(name) {
        if (!name.trim()) return;
        const updated = [...extra, { id: "e-" + Date.now(), name, done: false, date: today }];
        setExtra(updated);
        storageSet("extra-tasks", updated);
      }

      function toggleExtra(id) {
        const updated = extra.map(e => e.id === id ? { ...e, done: !e.done } : e);
        setExtra(updated);
        storageSet("extra-tasks", updated);
      }

      function deleteExtra(id) {
        const updated = extra.filter(e => e.id !== id);
        setExtra(updated);
        storageSet("extra-tasks", updated);
      }

      function addTask(newTask) {
        const updated = [...tasks, { ...newTask, id: "t-" + Date.now(), lastDone: null }];
        setTasks(updated);
        storageSet("tasks-catalog", updated);
      }

      function deleteTask(id) {
        const updated = tasks.filter(t => t.id !== id);
        setTasks(updated);
        storageSet("tasks-catalog", updated);
      }

      function updateStock(id, delta) {
        const updated = inventory.map(item => item.id === id ? { ...item, stock: Math.max(0, item.stock + delta) } : item);
        setInventory(updated);
        storageSet("inventory-data", updated);
      }

      function addInventoryItem(item) {
        const updated = [...inventory, { ...item, id: "i-" + Date.now() }];
        setInventory(updated);
        storageSet("inventory-data", updated);
      }

      function addLogEntry(text, copyToBacklog = false) {
        if (!text.trim()) return;
        const entry = { id: "l-" + Date.now(), date: today, time: new Date().toLocaleTimeString("cs-CZ", { hour: "2-digit", minute: "2-digit" }), text, author: "Vláďa (Školník & Údržbář)" };
        const updatedLog = [entry, ...log];
        setLog(updatedLog);
        storageSet("handover-log", updatedLog);

        if (copyToBacklog) {
          addTask({
            name: "Závada: " + text.slice(0, 35) + "...",
            category: "indoor",
            priority: "high",
            tag: "Revize",
            interval: 1,
            notes: text,
            months: [],
            areas: [selectedAreaFilter === "all" ? "skola_mp" : selectedAreaFilter]
          });
        }
      }

      function startShift(area) {
        if (sessions.some(s => !s.end)) return;
        const updated = [{ id: "s-" + Date.now(), date: today, start: new Date().toISOString(), end: null, area: area || "skola_mp" }, ...sessions];
        setSessions(updated);
        storageSet("work-sessions", updated);
      }

      function endShift() {
        const idx = sessions.findIndex(s => !s.end);
        if (idx < 0) return;
        const now = new Date().toISOString();
        const s = sessions[idx];
        const hours = Math.round(((new Date(now) - new Date(s.start)) / 3600000) * 100) / 100;
        const rate = wageSettings.areaRates[s.area] || wageSettings.defaultRate;
        const updated = sessions.map((x, i) => i === idx ? { ...x, end: now, hours, rate, wage: Math.round(hours * rate) } : x);
        setSessions(updated);
        storageSet("work-sessions", updated);
      }

      function deleteSession(id) {
        const updated = sessions.filter(s => s.id !== id);
        setSessions(updated);
        storageSet("work-sessions", updated);
      }

      return e("div", { className: "min-h-screen bg-[#1B1E21] text-[#ECECEA] p-4 sm:p-6 font-sans max-w-4xl mx-auto" },
        // HLAVIČKA
        e("div", { className: "flex flex-wrap justify-between items-center gap-4 mb-4 border-b border-[#3A3F44] pb-4" },
          e("div", null,
            e("h1", { className: "text-2xl font-bold uppercase tracking-wide text-[#F2A93B]" }, "Provozní deník údržby & školníka"),
            e("p", { className: "text-xs text-gray-400 capitalize mt-0.5" }, 
              new Intl.DateTimeFormat("cs-CZ", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(new Date()) + 
              ` | Troja API: ${apiWeather.temp}°C, vítr ${apiWeather.wind} m/s`
            )
          ),
          
          // VOLBA POČASÍ
          e("div", { className: "flex bg-[#24282C] p-1 rounded-xl border border-[#3A3F44]" },
            e("button", {
              onClick: () => setWeatherMode("dry"),
              className: `px-3 py-1.5 rounded-lg text-xs font-bold transition ${weatherMode === "dry" ? "bg-amber-500 text-black shadow" : "text-gray-400 hover:text-white"}`
            }, "☀️ Sucho"),
            e("button", {
              onClick: () => setWeatherMode("rain"),
              className: `px-3 py-1.5 rounded-lg text-xs font-bold transition ${weatherMode === "rain" ? "bg-blue-600 text-white shadow" : "text-gray-400 hover:text-white"}`
            }, "🌧️ Mokro"),
            e("button", {
              onClick: () => setWeatherMode("auto"),
              className: `px-3 py-1.5 rounded-lg text-xs font-bold transition ${weatherMode === "auto" ? "bg-[#F2A93B] text-black shadow" : "text-gray-400 hover:text-white"}`
            }, `🤖 Auto (${apiWeather.isRaining ? "Déšť" : "Sucho"})`)
          )
        ),

        // STAV POČASÍ INFORMAČNÍ LIŠTA
        e("div", { className: `mb-4 p-2.5 rounded-xl text-xs font-semibold flex items-center justify-between border ${isRainingActive ? "bg-red-950/40 border-red-500/60 text-red-200" : "bg-emerald-950/40 border-emerald-500/60 text-emerald-200"}` },
          e("span", null, isRainingActive ? "🌧️ AKTIVNÍ: MOKRÁ VARIANTA (Venkovní práce pozastaveny)" : "☀️ AKTIVNÍ: SUCHÁ VARIANTA (Všechny úkoly dostupné)"),
          e("span", { className: "opacity-75 text-[11px]" }, weatherMode === "auto" ? "Zdroj: API Praha-Troja" : "Zdroj: Ručně vynuceno")
        ),

        // TEPLOTNÍ UPOZORNĚNÍ
        apiWeather.temp < 18 && e("div", { className: "mb-4 p-3 rounded-xl bg-amber-950/50 border border-amber-500/50 text-amber-300 text-xs flex items-center gap-2" },
          "🔥 ", e("strong", null, "Ranní chlad (<18°C):"), " Vytvořena priorita pro ranní zátop v Jurtě, Mobilheimu a Školním prostoru!"
        ),

        // FILTR OBJEKTŮ
        e("div", { className: "flex items-center gap-2 mb-6 overflow-x-auto pb-2" },
          e("span", { className: "text-xs font-bold text-gray-400 uppercase mr-2" }, "Objekt:"),
          e("button", {
            onClick: () => setSelectedAreaFilter("all"),
            className: `px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition ${selectedAreaFilter === "all" ? "bg-[#F2A93B] text-black" : "bg-[#24282C] text-gray-400 border border-[#3A3F44]"}`
          }, "Všechny objekty"),
          AREAS.map(a => e("button", {
            key: a.id,
            onClick: () => setSelectedAreaFilter(a.id),
            className: `px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap border transition`,
            style: {
              borderColor: a.color,
              backgroundColor: selectedAreaFilter === a.id ? a.color : "#24282C",
              color: selectedAreaFilter === a.id ? "#ffffff" : a.color
            }
          }, a.label))
        ),

        // NAVIGAČNÍ MENU
        e("div", { className: "flex gap-1.5 mb-6 bg-[#24282C] p-1.5 rounded-2xl border border-[#3A3F44] overflow-x-auto" },
          [
            { id: "dnes", label: "Dnes & Úkoly" },
            { id: "harmonogram", label: "📅 Master Harmonogram" },
            { id: "objekty", label: "Objekty & Pasport" },
            { id: "sklad", label: "Sklad & Materiál" },
            { id: "katalog", label: "Katalog" },
            { id: "vykaz", label: "Výkaz & Uzávěrka" },
            { id: "protokol", label: "Protokol" }
          ].map(t => e("button", {
            key: t.id,
            onClick: () => setTab(t.id),
            className: `flex-1 min-w-[100px] py-2.5 rounded-xl text-xs font-bold transition text-center whitespace-nowrap ${tab === t.id ? "bg-[#F2A93B] text-black shadow-md" : "text-gray-400 hover:text-white"}`
          }, t.label))
        ),

        // ZÁLOŽKY

      return e("div", { className: "space-y-6" },
        e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44]" },
          e("h2", { className: "text-xs font-bold uppercase tracking-wider text-[#F2A93B] mb-2" }, "Večerní hlášení / Záznam závad"),
          e("textarea", {
            value: text,
            onChange: e => setText(e.target.value),
            placeholder: "Zapište odchylky od plánu, docházející materiál nebo nově zjištěné závady v objektu...",
            className: "w-full p-3 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm text-white outline-none h-28 mb-3"
          }),
          e("div", { className: "flex gap-2" },
            e("button", {
              onClick: () => { onAddLog(text, false); setText(""); },
              className: "flex-1 py-2.5 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-gray-200 font-bold text-xs"
            }, "Uložit běžný zápis"),
            e("button", {
              onClick: () => { onAddLog(text, true); setText(""); },
              className: "flex-1 py-2.5 rounded-xl bg-[#F2A93B] text-black font-bold text-xs"
            }, "🚨 Zapsat a Převést do Backlogu")
          )
        ),

        e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44]" },
          e("h2", { className: "text-xs font-bold uppercase tracking-wider text-gray-400 mb-3" }, "Historie hlášení"),
          log.length === 0 ? e("p", { className: "text-sm text-gray-500 italic" }, "Zatím nebyl zapsán žádný denní protokol.") :
          log.map(l => e("div", { key: l.id, className: "p-3 mb-2 rounded-xl bg-[#2E3338] border border-[#3A3F44]" },
            e("div", { className: "flex justify-between text-xs text-gray-400 mb-1" },
              e("span", { className: "font-bold text-[#F2A93B]" }, l.author || "Vláďa (Školník & Údržbář)"),
              e("span", null, `${l.date} v ${l.time}`)
            ),
            e("p", { className: "text-sm text-gray-200 whitespace-pre-line" }, l.text)
          ))
        )
      );
    }

    function VykazTab({ sessions, onStart, onEnd, onDelete, wageSettings, setWageSettings }) {
      const [selectedArea, setSelectedArea] = useState("skola_mp");
      const active = sessions.find(s => !s.end);

      const breakdownByArea = useMemo(() => {
        const result = {};
        AREAS.forEach(a => { result[a.id] = { hours: 0, wage: 0, label: a.label, color: a.color }; });
        sessions.forEach(s => {
          if (s.end && s.area && result[s.area]) {
            result[s.area].hours += (s.hours || 0);
            result[s.area].wage += (s.wage || 0);
          }
        });
        return result;
      }, [sessions]);

      const totalWage = sessions.reduce((acc, s) => acc + (s.wage || 0), 0);
      const totalHours = Math.round(sessions.reduce((acc, s) => acc + (s.hours || 0), 0) * 100) / 100;

      return e("div", { className: "space-y-6" },
        e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44] text-center" },
          active ? e("div", { className: "space-y-3" },
            e("p", { className: "text-sm text-green-400 font-bold" }, `⏱️ Měření času běží (od ${new Date(active.start).toLocaleTimeString("cs-CZ", { hour: "2-digit", minute: "2-digit" })})`),
            e("button", { onClick: onEnd, className: "w-full py-3 rounded-xl bg-red-500 text-white font-bold text-sm shadow-lg" }, "Ukončit směnu")
          ) : e("div", { className: "space-y-3" },
            e("p", { className: "text-xs font-bold text-gray-400 uppercase" }, "Vyberte objekt pro novou směnu:"),
            e("select", { value: selectedArea, onChange: e => setSelectedArea(e.target.value), className: "w-full p-2.5 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm text-white outline-none" },
              AREAS.map(a => e("option", { key: a.id, value: a.id }, a.label))
            ),
            e("button", { onClick: () => onStart(selectedArea), className: "w-full py-3 rounded-xl bg-[#F2A93B] text-black font-bold text-sm shadow-lg" }, "Zahájit směnu")
          )
        ),

        e("div", { className: "grid grid-cols-2 gap-4" },
          e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44] text-center" },
            e("p", { className: "text-xs text-gray-400 uppercase font-bold" }, "Odpracováno celkem"),
            e("p", { className: "text-2xl font-bold text-[#F2A93B] mt-1" }, `${totalHours} h`)
          ),
          e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44] text-center" },
            e("p", { className: "text-xs text-gray-400 uppercase font-bold" }, "Celková výplata"),
            e("p", { className: "text-2xl font-bold text-green-400 mt-1" }, `${totalWage} Kč`)
          )
        ),

        e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44]" },
          e("h2", { className: "text-xs font-bold uppercase tracking-wider text-[#F2A93B] mb-3" }, "Měsíční uzávěrka: Náklady podle objektů"),
          e("div", { className: "space-y-2" },
            Object.keys(breakdownByArea).map(areaId => {
              const item = breakdownByArea[areaId];
              return e("div", { key: areaId, className: "flex justify-between items-center p-2.5 bg-[#2E3338] rounded-xl border border-[#3A3F44]" },
                e("div", { className: "flex items-center gap-2" },
                  e("div", { className: "w-3 h-3 rounded-full", style: { backgroundColor: item.color } }),
                  e("span", { className: "text-xs font-semibold text-gray-200" }, item.label)
                ),
                e("div", { className: "text-right text-xs" },
                  e("span", { className: "text-gray-400 mr-3" }, `${Math.round(item.hours * 10) / 10} h`),
                  e("span", { className: "font-bold text-green-400" }, `${item.wage} Kč`)
                )
              );
            })
          )
        ),

        e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44]" },
          e("h2", { className: "text-xs font-bold uppercase tracking-wider text-gray-400 mb-3" }, "Přehled odpracovaných směn"),
          sessions.length === 0 ? e("p", { className: "text-sm text-gray-500 italic" }, "Zatím nebyla zaznamenána žádná směna.") :
          sessions.map(s => e("div", { key: s.id, className: "flex justify-between items-center p-3 mb-2 rounded-xl bg-[#2E3338] border border-[#3A3F44]" },
            e("div", null,
              e("p", { className: "text-sm font-bold text-gray-200" }, `${s.date} ${s.end ? "" : "(Probíhá…)"}`),
              e("p", { className: "text-xs text-gray-400" }, `Místo: ${(AREAS.find(a=>a.id===s.area)||{}).label || s.area}`),
              s.hours && e("p", { className: "text-xs text-green-400 font-semibold mt-0.5" }, `${s.hours} h × ${s.rate} Kč/h = ${s.wage} Kč`)
            ),
            s.end && e("button", { onClick: () => onDelete(s.id), className: "text-gray-500 hover:text-red-400 text-xs px-2 py-1" }, "Smazat")
          ))
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
