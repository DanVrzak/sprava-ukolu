<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Provozní deník údržby – Troja & Objekty</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/lucide-react@latest"></script>
</head>
<body class="bg-[#1B1E21] text-[#ECECEA] antialiased">
  <div id="root"></div>

  <script>
    const { useState, useEffect, useMemo, createElement: e } = React;

    // ---------- KONSTANTY A BAREVNÉ SCHÉMA ----------
    const C = {
      bg: "#1B1E21", panel: "#24282C", panelAlt: "#2E3338", border: "#3A3F44",
      amber: "#F2A93B", amberDark: "#C98420", green: "#5FB77E", red: "#E2694B",
      text: "#ECECEA", muted: "#9AA0A6"
    };

    const AREAS = [
      { id: "safran", label: "Šafrán", color: "#8B5FBF" },
      { id: "komunitni", label: "Komunitní prostor", color: "#3B5BA5" },
      { id: "skolni", label: "Školní prostor", color: "#2E8B7D" },
      { id: "byty", label: "Byty", color: "#6B6B6B" },
      { id: "hrastice", label: "Chata Hraštice", color: "#C24B4B" },
      { id: "vrchlabi", label: "Vrchlabí 172", color: "#9A8B3F" }
    ];

    // Kompletní katalog úkolů rozdělený precizně podle všech 6 objektů
    const SEED_TASKS = [
      // --- ŠAFRÁN (Dílna, Technické zázemí) ---
      { id: "v7", name: "Dílna: Údržba techniky (sekačky, křovinořezy)", role: "udrzbar", category: "indoor", areas: ["safran"], months: [], interval: 30, notes: "Kontrola oleje, svíček, nabití aku baterií, broušení nožů sekaček.", lastDone: null },
      { id: "s1", name: "Šafrán: Kontrola a čištění lapačů tuku a odpadů", role: "udrzbar", category: "indoor", areas: ["safran"], months: [], interval: 60, notes: "Kontrola průchodnosti syfonů, výměna filtrů a sanace odpadního potrubí.", lastDone: null },
      
      // --- KOMUNITNÍ PROSTOR ---
      { id: "v1_kom", name: "Komunitní pr.: Větrání & kontrola vlhkosti", role: "udrzbar", category: "indoor", areas: ["komunitni"], months: [3, 4, 5, 6, 7, 8, 9, 10], interval: 1, notes: "Pravidelné větrání, kontrola plísní v rohách a stavu podlah.", lastDone: null },
      { id: "v2_kom", name: "Komunitní pr.: Údržba venkovního posezení & ohniště", role: "udrzbar", category: "outdoor", areas: ["komunitni"], months: [4, 5, 6, 7, 8, 9, 10], interval: 14, notes: "Čištění ohniště, kontrola laviček (dotažení šroubů, nátěr dřeva).", lastDone: null },

      // --- ŠKOLNÍ PROSTOR (Jurta, Teepee, Hřiště) ---
      { id: "v1_heat", name: "Školní pr.: Ranní zátop v jurtě a mobilheimu (<18°C)", role: "udrzbar", category: "indoor", areas: ["skolni"], months: [9, 10, 11, 12, 1, 2, 3, 4], interval: 1, notes: "Zatopit před příchodem dětí do 7:30.", lastDone: null },
      { id: "v5", name: "Školní pr.: Zátěžová zkouška herních prvků a dopadových ploch", role: "udrzbar", category: "outdoor", areas: ["skolni"], months: [], interval: 7, notes: "Každé pondělí: zkouška vlastní vahou, doplňování kačírku/štěpky pod průlezkami.", lastDone: null },
      { id: "v3_fruit", name: "Školní pr.: Sběr padaného ovoce u hřiště", role: "udrzbar", category: "outdoor", areas: ["skolni"], months: [8, 9], interval: 1, notes: "Prevence výskytu vos v blízkosti dětí.", lastDone: null },

      // --- BYTY (Nájemní údržba & Technické revize) ---
      { id: "b1", name: "Byty: Ododečty vodoměrů & měřičů tepla", role: "udrzbar", category: "indoor", areas: ["byty"], months: [], interval: 30, notes: "Kopis stavu spotřeby vody a tepla na konci měsíce pro rozúčtování.", lastDone: null },
      { id: "b2", name: "Byty: Kontrola těsnosti ventilů, WC a baterií", role: "udrzbar", category: "indoor", areas: ["byty"], months: [], interval: 90, notes: "Preventivní prohlídka proti protékání záchodů a rohových ventilů pod dřezem.", lastDone: null },
      { id: "b3", name: "Byty: Kontrola hlásičů kouře a CO čidel", role: "udrzbar", category: "indoor", areas: ["byty"], months: [], interval: 180, notes: "Test baterií v detektorech kouře a plynu v bytech.", lastDone: null },
      { id: "b4", name: "Byty: Pročištění odvětrávání a stoupacích šachet", role: "udrzbar", category: "indoor", areas: ["byty"], months: [10], interval: 365, notes: "Kontrola mřížek ventilace a čištění odsávání v koupelnách.", lastDone: null },

      // --- CHATA HRAŠTICE (Rekreační & Sezónní provoz) ---
      { id: "h1", name: "Hraštice: Kontrola a prořez stromů u střešní krytiny", role: "udrzbar", category: "outdoor", areas: ["hrastice"], months: [3, 4, 10, 11], interval: 180, notes: "Odstranění větví zasahujících do střechy nebo drátů napětí.", lastDone: null },
      { id: "h2", name: "Hraštice: Kontrola septiku / jímky & kontrolní šachty", role: "udrzbar", category: "outdoor", areas: ["hrastice"], months: [], interval: 30, notes: "Kontrola hladiny naplnění a funkčnosti čerpadla.", lastDone: null },
      { id: "v9_hrastice", name: "Hraštice: Kompletní odvodnění & zazimování objektu", role: "udrzbar", category: "outdoor", areas: ["hrastice"], months: [10, 11], interval: 365, notes: "Vypustit rozvody vody, profouknout kompresorem, nemrznoucí směs do WC.", lastDone: null },

      // --- VRCHLABÍ 172 (Horský objekt) ---
      { id: "vr1", name: "Vrchlabí: Kontrola střechy, žlabů a sněhových zábran", role: "udrzbar", category: "outdoor", areas: ["vrchlabi"], months: [9, 10, 11], interval: 90, notes: "Čištění žlabů od listí před zimou a kontrola upevnění sněhových háků.", lastDone: null },
      { id: "vr2", name: "Vrchlabí: Revize a kontrola kotle / topného systému", role: "udrzbar", category: "indoor", areas: ["vrchlabi"], months: [8, 9], interval: 365, notes: "Servisní prohlídka kotle, odvzdušnění radiátorů v celém objektu.", lastDone: null },
      { id: "vr3", name: "Vrchlabí: Kontrola zásoby posypové soli a příprava nářadí na sníh", role: "udrzbar", category: "outdoor", areas: ["vrchlabi"], months: [10, 11], interval: 30, notes: "Příprava hráběl na sníh, frézy a dostatek posypového materiálu.", lastDone: null },

      // --- SPOLČNÉ VENKOVNÍ PRÁCE (Více objektů) ---
      { id: "v2", name: "Zalévání záhonů, květin a stromků (podvečer po 16:45)", role: "udrzbar", category: "outdoor", areas: ["safran", "komunitni", "skolni"], months: [4, 5, 6, 7, 8, 9], interval: 2, notes: "Zalévat až po 16:45. Pokud pršelo, vynechat.", lastDone: null },
      { id: "v3", name: "Sekání trávy (Srpnový střih 5-6 cm)", role: "udrzbar", category: "outdoor", areas: ["safran", "komunitni", "skolni", "hrastice"], months: [4, 5, 6, 7, 8, 9, 10], interval: 10, notes: "Konec srpna: výška 5-6 cm. Za deště ZÁKAZ sekání!", lastDone: null },
      { id: "v4", name: "Štípání a rovnání dřeva pod střechu", role: "udrzbar", category: "outdoor", areas: ["safran", "komunitni", "skolni", "hrastice", "vrchlabi"], months: [8, 9, 10], interval: 14, notes: "Chystat min. 1 měsíc předem, aby dřevo proschlo.", lastDone: null },
      { id: "v6", name: "Čištění okapů a svodů", role: "udrzbar", category: "outdoor", areas: ["safran", "komunitni", "skolni", "hrastice", "vrchlabi"], months: [3, 4, 5, 9, 10, 11], interval: 30, notes: "Žebřík stavět v poměru 1:4. Jen za bezvětří!", lastDone: null }
    ];

    function todayStr() { return new Date().toISOString().slice(0, 10); }
    function daysBetween(a, b) { return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000); }
    function isSeasonActive(t, m) { return !t.months || t.months.length === 0 || t.months.includes(m); }
    function isDue(t, today) { return !t.lastDone || daysBetween(t.lastDone, today) >= t.interval; }
    
    function storageGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } }
    function storageSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }

    // ---------- HLAVNÍ APLIKACE ----------
    function App() {
      const [tab, setTab] = useState("dnes");
      const [tasks, setTasks] = useState([]);
      const [weather, setWeather] = useState({ date: todayStr(), isRaining: false, temp: 16, wind: 3 });
      const [extra, setExtra] = useState([]);
      const [log, setLog] = useState([]);
      const [sessions, setSessions] = useState([]);
      const [selectedAreaFilter, setSelectedAreaFilter] = useState("all");
      const [wageSettings, setWageSettings] = useState({ defaultRate: 300, areaRates: { safran: 300, komunitni: 300, skolni: 300, byty: 350, hrastice: 350, vrchlabi: 350 } });

      useEffect(() => {
        setTasks(storageGet("tasks-catalog") || SEED_TASKS);
        setExtra(storageGet("extra-tasks") || []);
        setLog(storageGet("handover-log") || []);
        setSessions(storageGet("work-sessions") || []);
        const ws = storageGet("wage-settings");
        if (ws) setWageSettings(ws);

        const localWeather = storageGet("weather-state");
        
        fetch('https://api.open-meteo.com/v1/forecast?latitude=50.1162&longitude=14.4175&current_weather=true')
          .then(res => res.json())
          .then(data => {
            if (data.current_weather) {
              const newW = {
                date: todayStr(),
                isRaining: localWeather !== null ? localWeather.isRaining : (data.current_weather.weathercode >= 51),
                temp: data.current_weather.temperature,
                wind: data.current_weather.windspeed
              };
              setWeather(newW);
              storageSet("weather-state", newW);
            }
          })
          .catch(() => {
            if (localWeather) setWeather(localWeather);
          });
      }, []);

      const today = todayStr();
      const month = new Date().getMonth() + 1;

      // Ruční přepínač počasí - Funkční a okamžitá reakce!
      function toggleRain() {
        const next = { ...weather, date: today, isRaining: !weather.isRaining };
        setWeather(next);
        storageSet("weather-state", next);
      }

      // Filtr podle objektů
      const filteredTasks = useMemo(() => {
        if (selectedAreaFilter === "all") return tasks;
        return tasks.filter(t => t.areas && t.areas.includes(selectedAreaFilter));
      }, [tasks, selectedAreaFilter]);

      // Vyhodnocení úkolů + Bezpečnostní pravidla
      const due = useMemo(() => filteredTasks.filter(t => isSeasonActive(t, month) && isDue(t, today)), [filteredTasks, month, today]);
      
      const isOutdoorBlocked = weather.isRaining || weather.wind > 6;
      const dueIndoor = due.filter(t => t.category === "indoor");
      const dueOutdoor = isOutdoorBlocked ? [] : due.filter(t => t.category === "outdoor");
      const outdoorBlocked = isOutdoorBlocked ? due.filter(t => t.category === "outdoor") : [];

      function toggleTask(id) {
        const updated = tasks.map(t => t.id === id ? { ...t, lastDone: t.lastDone === today ? null : today } : t);
        setTasks(updated);
        storageSet("tasks-catalog", updated);
      }

      function addExtra(name) {
        if (!name.trim()) return;
        const updated = [...extra, { id: "e-" + Date.now(), name, done: false, date: today }];
        setExtra(updated);
        storageSet("extra-tasks", updated);
      }

      function toggleExtra(id) {
        const updated = extra.map(e => e.id === id ? { ...e, done: !e.done } : e);
        setExtra(updated);
        storageSet("extra-tasks", updated);
      }

      function deleteExtra(id) {
        const updated = extra.filter(e => e.id !== id);
        setExtra(updated);
        storageSet("extra-tasks", updated);
      }

      function addTask(newTask) {
        const updated = [...tasks, { ...newTask, id: "t-" + Date.now(), lastDone: null }];
        setTasks(updated);
        storageSet("tasks-catalog", updated);
      }

      function deleteTask(id) {
        const updated = tasks.filter(t => t.id !== id);
        setTasks(updated);
        storageSet("tasks-catalog", updated);
      }

      function addLogEntry(text, copyToBacklog = false) {
        if (!text.trim()) return;
        const entry = { id: "l-" + Date.now(), date: today, time: new Date().toLocaleTimeString("cs-CZ", { hour: "2-digit", minute: "2-digit" }), text, author: "Údržbář Vláďa" };
        const updatedLog = [entry, ...log];
        setLog(updatedLog);
        storageSet("handover-log", updatedLog);

        if (copyToBacklog) {
          addTask({
            name: "Závada: " + text.slice(0, 35) + "...",
            category: "indoor",
            interval: 1,
            notes: text,
            months: [],
            areas: [selectedAreaFilter === "all" ? "safran" : selectedAreaFilter]
          });
        }
      }

      function startShift(area) {
        if (sessions.some(s => !s.end)) return;
        const updated = [{ id: "s-" + Date.now(), date: today, start: new Date().toISOString(), end: null, area: area || "safran" }, ...sessions];
        setSessions(updated);
        storageSet("work-sessions", updated);
      }

      function endShift() {
        const idx = sessions.findIndex(s => !s.end);
        if (idx < 0) return;
        const now = new Date().toISOString();
        const s = sessions[idx];
        const hours = Math.round(((new Date(now) - new Date(s.start)) / 3600000) * 100) / 100;
        const rate = wageSettings.areaRates[s.area] || wageSettings.defaultRate;
        const updated = sessions.map((x, i) => i === idx ? { ...x, end: now, hours, rate, wage: Math.round(hours * rate) } : x);
        setSessions(updated);
        storageSet("work-sessions", updated);
      }

      function deleteSession(id) {
        const updated = sessions.filter(s => s.id !== id);
        setSessions(updated);
        storageSet("work-sessions", updated);
      }

      return e("div", { className: "min-h-screen bg-[#1B1E21] text-[#ECECEA] p-4 sm:p-6 font-sans max-w-4xl mx-auto" },
        // HLAVIČKA APLIKACE METEO PODMÍNKY
        e("div", { className: "flex flex-wrap justify-between items-center gap-4 mb-6 border-b border-[#3A3F44] pb-4" },
          e("div", null,
            e("h1", { className: "text-2xl font-bold uppercase tracking-wide text-[#F2A93B]" }, "Provozní deník údržby"),
            e("p", { className: "text-sm text-gray-400 capitalize" }, 
              new Intl.DateTimeFormat("cs-CZ", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(new Date()) + 
              ` | Teplota: ${weather.temp}°C | Vítr: ${weather.wind} m/s`
            )
          ),
          e("button", {
            onClick: toggleRain,
            className: `px-4 py-2 rounded-xl text-sm font-bold border transition flex items-center gap-2 cursor-pointer shadow-md ${weather.isRaining ? "bg-red-900/60 border-red-500 text-red-200 animate-pulse" : "bg-[#2E3338] border-[#3A3F44] text-gray-200 hover:bg-[#3A3F44]"}`
          },
            weather.isRaining ? "🌧️ Dnes PRŠÍ (Klikni pro Sucho)" : "☀️ Dnes je SUCHO (Klikni pro Déšť)"
          )
        ),

        // INFORMACE O TEPLOTĚ
        weather.temp < 18 && e("div", { className: "mb-4 p-3 rounded-xl bg-amber-950/50 border border-amber-500/50 text-amber-300 text-xs flex items-center gap-2" },
          "🔥 ", e("strong", null, "Ranní chlad (<18°C):"), " Vytvořena priorita pro ranní zátop v jurtě a mobilheimu!"
        ),

        // FILTR PODLE OBJEKTŮ
        e("div", { className: "flex items-center gap-2 mb-6 overflow-x-auto pb-2" },
          e("span", { className: "text-xs font-bold text-gray-400 uppercase mr-2" }, "Objekt:"),
          e("button", {
            onClick: () => setSelectedAreaFilter("all"),
            className: `px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition ${selectedAreaFilter === "all" ? "bg-[#F2A93B] text-black" : "bg-[#24282C] text-gray-400 border border-[#3A3F44]"}`
          }, "Všechny objekty"),
          AREAS.map(a => e("button", {
            key: a.id,
            onClick: () => setSelectedAreaFilter(a.id),
            className: `px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap border transition`,
            style: {
              borderColor: a.color,
              backgroundColor: selectedAreaFilter === a.id ? a.color : "#24282C",
              color: selectedAreaFilter === a.id ? "#ffffff" : a.color
            }
          }, a.label))
        ),

        // NAVIGAČNÍ ZÁLOŽKY
        e("div", { className: "flex gap-2 mb-6 bg-[#24282C] p-1.5 rounded-2xl border border-[#3A3F44]" },
          [
            { id: "dnes", label: "Dnes & Úkoly" },
            { id: "katalog", label: "Katalog úkolů" },
            { id: "vykaz", label: "Výkaz práce" },
            { id: "protokol", label: "Protokol & Závady" }
          ].map(t => e("button", {
            key: t.id,
            onClick: () => setTab(t.id),
            className: `flex-1 py-2.5 rounded-xl text-sm font-bold transition text-center ${tab === t.id ? "bg-[#F2A93B] text-black shadow-md" : "text-gray-400 hover:text-white"}`
          }, t.label))
        ),

        // OBSAH ZÁLOŽEK
        tab === "dnes" && e(DnesTab, { dueIndoor, dueOutdoor, outdoorBlocked, extra, onToggleTask: toggleTask, onAddExtra: addExtra, onToggleExtra: toggleExtra, onDeleteExtra: deleteExtra, today, isOutdoorBlocked }),
        tab === "katalog" && e(KatalogTab, { tasks: filteredTasks, onAddTask: addTask, onDeleteTask: deleteTask }),
        tab === "protokol" && e(ProtokolTab, { log, onAddLog: addLogEntry }),
        tab === "vykaz" && e(VykazTab, { sessions, onStart: startShift, onEnd: endShift, onDelete: deleteSession, wageSettings, setWageSettings })
      );
    }

    // ---------- ZÁLOŽKA DNES ----------
    function DnesTab({ dueIndoor, dueOutdoor, outdoorBlocked, extra, onToggleTask, onAddExtra, onToggleExtra, onDeleteExtra, today, isOutdoorBlocked }) {
      const [text, setText] = useState("");
      return e("div", { className: "space-y-6" },
        outdoorBlocked.length > 0 && e("div", { className: "p-4 rounded-xl bg-red-900/40 border border-red-500/60 text-red-200" },
          e("p", { className: "font-bold text-sm mb-1 flex items-center gap-2" }, `🛑 Odloženo kvůli počasí / větru (${outdoorBlocked.length})`),
          e("p", { className: "text-xs mb-2 text-red-300 opacity-90" }, "Venkovní práce a práce na střeše/žebříku jsou pozastaveny. Využijte čas na údržbu v dílně nebo revize vnitřků!"),
          outdoorBlocked.map(t => e("p", { key: t.id, className: "text-xs font-semibold opacity-90" }, `• ${t.name}`))
        ),

        e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44]" },
          e("h2", { className: "text-xs font-bold uppercase tracking-wider text-[#F2A93B] mb-3" }, `Vnitřní & Kryté úkoly (${dueIndoor.length})`),
          dueIndoor.length === 0 ? e("p", { className: "text-sm text-gray-500 italic" }, "Žádné plánované vnitřní úkoly.") :
          dueIndoor.map(t => e(TaskCard, { key: t.id, task: t, onToggle: onToggleTask, today }))
        ),

        e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44]" },
          e("h2", { className: "text-xs font-bold uppercase tracking-wider text-[#F2A93B] mb-3" }, `Venkovní úkoly (${dueOutdoor.length})`),
          dueOutdoor.length === 0 ? e("p", { className: "text-sm text-gray-500 italic" }, isOutdoorBlocked ? "Venkovní úkoly jsou v současnosti blokovány deštěm." : "Žádné venkovní úkoly k provedení.") :
          dueOutdoor.map(t => e(TaskCard, { key: t.id, task: t, onToggle: onToggleTask, today }))
        ),

        e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44]" },
          e("h2", { className: "text-xs font-bold uppercase tracking-wider text-[#F2A93B] mb-3" }, "Mimořádné úkoly dnes"),
          extra.map(ex => e("div", { key: ex.id, className: "flex items-center justify-between p-3 mb-2 rounded-xl bg-[#2E3338] border border-[#3A3F44]" },
            e("div", { className: "flex items-center gap-3 cursor-pointer", onClick: () => onToggleExtra(ex.id) },
              e("span", { className: "text-lg" }, ex.done ? "✅" : "⚪"),
              e("span", { className: `text-sm ${ex.done ? "line-through text-gray-500" : "text-gray-200"}` }, ex.name)
            ),
            e("button", { onClick: () => onDeleteExtra(ex.id), className: "text-gray-500 hover:text-red-400 text-xs px-2" }, "Smazat")
          )),
          e("div", { className: "flex gap-2 mt-3" },
            e("input", {
              value: text,
              onChange: e => setText(e.target.value),
              onKeyDown: e => { if (e.key === "Enter") { onAddExtra(text); setText(""); } },
              placeholder: "Přidat mimořádný úkol…",
              className: "flex-1 px-3 py-2 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm text-white outline-none"
            }),
            e("button", { onClick: () => { onAddExtra(text); setText(""); }, className: "px-4 py-2 rounded-xl bg-[#F2A93B] text-black font-bold text-sm" }, "Přidat")
          )
        )
      );
    }

    function TaskCard({ task, onToggle, today }) {
      const isDone = task.lastDone === today;
      return e("div", {
        onClick: () => onToggle(task.id),
        className: "flex items-start justify-between p-3 mb-2 rounded-xl bg-[#2E3338] border border-[#3A3F44] cursor-pointer hover:border-gray-500 transition"
      },
        e("div", { className: "flex items-start gap-3" },
          e("span", { className: "text-lg mt-0.5" }, isDone ? "✅" : "⚪"),
          e("div", null,
            e("p", { className: `text-sm font-medium ${isDone ? "line-through text-gray-500" : "text-gray-100"}` }, task.name),
            task.notes && e("p", { className: "text-xs text-gray-400 mt-0.5" }, task.notes)
          )
        ),
        e("div", { className: "flex gap-1 flex-wrap justify-end" },
          (task.areas || []).map(aId => {
            const area = AREAS.find(a => a.id === aId);
            return area ? e("span", { key: aId, className: "text-[10px] px-2 py-0.5 rounded-full font-bold", style: { backgroundColor: area.color + "22", color: area.color, border: `1px solid ${area.color}55` } }, area.label) : null;
          })
        )
      );
    }

    // ---------- ZÁLOŽKA KATALOG ----------
    function KatalogTab({ tasks, onAddTask, onDeleteTask }) {
      const [name, setName] = useState("");
      const [cat, setCat] = useState("indoor");
      const [interval, setInterval] = useState(7);
      const [notes, setNotes] = useState("");
      const [selectedAreas, setSelectedAreas] = useState(["safran"]);

      function toggleAreaSelection(id) {
        if (selectedAreas.includes(id)) {
          setSelectedAreas(selectedAreas.filter(a => a !== id));
        } else {
          setSelectedAreas([...selectedAreas, id]);
        }
      }

      return e("div", { className: "space-y-6" },
        e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44]" },
          e("h3", { className: "text-sm font-bold text-[#F2A93B] mb-3 uppercase tracking-wider" }, "Přidat nový úkol do katalogu"),
          e("div", { className: "space-y-3" },
            e("input", { value: name, onChange: e => setName(e.target.value), placeholder: "Název úkolu", className: "w-full px-3 py-2 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm text-white outline-none" }),
            e("div", { className: "flex gap-2 flex-wrap" },
              e("select", { value: cat, onChange: e => setCat(e.target.value), className: "flex-1 px-3 py-2 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm text-white outline-none" },
                e("option", { value: "indoor" }, "Vnitřní / Krytý úkol"),
                e("option", { value: "outdoor" }, "Venkovní úkol")
              ),
              e("input", { type: "number", value: interval, onChange: e => setInterval(Number(e.target.value)), placeholder: "Interval (dní)", className: "w-32 px-3 py-2 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm text-white outline-none" })
            ),
            e("div", null,
              e("p", { className: "text-xs font-bold text-gray-400 mb-1.5" }, "Přiřadit k objektům:"),
              e("div", { className: "flex gap-1.5 flex-wrap" },
                AREAS.map(a => e("button", {
                  key: a.id,
                  type: "button",
                  onClick: () => toggleAreaSelection(a.id),
                  className: `px-2.5 py-1 rounded-lg text-xs font-bold border transition ${selectedAreas.includes(a.id) ? "bg-[#F2A93B] text-black border-[#F2A93B]" : "bg-[#2E3338] text-gray-400 border-[#3A3F44]"}`
                }, a.label))
              )
            ),
            e("input", { value: notes, onChange: e => setNotes(e.target.value), placeholder: "Poznámka / Instrukce", className: "w-full px-3 py-2 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm text-white outline-none" }),
            e("button", {
              onClick: () => {
                if (name.trim()) {
                  onAddTask({ name, category: cat, interval, notes, months: [], areas: selectedAreas });
                  setName(""); setNotes("");
                }
              },
              className: "w-full py-2.5 rounded-xl bg-[#F2A93B] text-black font-bold text-sm mt-2"
            }, "Uložit úkol do databáze")
          )
        ),

        e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44]" },
          e("h2", { className: "text-xs font-bold uppercase tracking-wider text-gray-400 mb-3" }, `Katalog systémových úkolů (${tasks.length})`),
          tasks.map(t => e("div", { key: t.id, className: "flex justify-between items-start p-3 mb-2 rounded-xl bg-[#2E3338] border border-[#3A3F44]" },
            e("div", null,
              e("p", { className: "text-sm font-semibold text-gray-100" }, t.name),
              e("p", { className: "text-xs text-gray-400 mt-0.5" }, `Opakování: co ${t.interval} dní | Kateg.: ${t.category === "indoor" ? "Vnitřní" : "Venkovní"}`),
              t.notes && e("p", { className: "text-xs text-amber-300/80 italic mt-1" }, t.notes)
            ),
            e("button", { onClick: () => onDeleteTask(t.id), className: "text-gray-500 hover:text-red-400 text-xs px-2 py-1" }, "Smazat")
          ))
        )
      );
    }

    // ---------- ZÁLOŽKA PROTOKOL & BACKLOG ----------
    function ProtokolTab({ log, onAddLog }) {
      const [text, setText] = useState("");
      return e("div", { className: "space-y-6" },
        e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44]" },
          e("h2", { className: "text-xs font-bold uppercase tracking-wider text-[#F2A93B] mb-2" }, "Večerní hlášení / Záznam závad"),
          e("textarea", {
            value: text,
            onChange: e => setText(e.target.value),
            placeholder: "Zapište odchylky od plánu, docházející materiál nebo nově zjištěné závady v objektu...",
            className: "w-full p-3 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm text-white outline-none h-28 mb-3"
          }),
          e("div", { className: "flex gap-2" },
            e("button", {
              onClick: () => { onAddLog(text, false); setText(""); },
              className: "flex-1 py-2.5 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-gray-200 font-bold text-xs"
            }, "Uložit běžný zápis"),
            e("button", {
              onClick: () => { onAddLog(text, true); setText(""); },
              className: "flex-1 py-2.5 rounded-xl bg-[#F2A93B] text-black font-bold text-xs"
            }, "🚨 Zapsat a Převést do Backlogu")
          )
        ),

        e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44]" },
          e("h2", { className: "text-xs font-bold uppercase tracking-wider text-gray-400 mb-3" }, "Historie hlášení"),
          log.length === 0 ? e("p", { className: "text-sm text-gray-500 italic" }, "Zatím nebyl zapsán žádný denní protokol.") :
          log.map(l => e("div", { key: l.id, className: "p-3 mb-2 rounded-xl bg-[#2E3338] border border-[#3A3F44]" },
            e("div", { className: "flex justify-between text-xs text-gray-400 mb-1" },
              e("span", { className: "font-bold text-[#F2A93B]" }, l.author || "Údržbář Vláďa"),
              e("span", null, `${l.date} v ${l.time}`)
            ),
            e("p", { className: "text-sm text-gray-200 whitespace-pre-line" }, l.text)
          ))
        )
      );
    }

    // ---------- ZÁLOŽKA VÝKAZ PRÁCE ----------
    function VykazTab({ sessions, onStart, onEnd, onDelete, wageSettings, setWageSettings }) {
      const [selectedArea, setSelectedArea] = useState("safran");
      const active = sessions.find(s => !s.end);
      const totalWage = sessions.reduce((acc, s) => acc + (s.wage || 0), 0);
      const totalHours = Math.round(sessions.reduce((acc, s) => acc + (s.hours || 0), 0) * 100) / 100;

      return e("div", { className: "space-y-6" },
        e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44] text-center" },
          active ? e("div", { className: "space-y-3" },
            e("p", { className: "text-sm text-green-400 font-bold" }, `⏱️ Měření času běží (od ${new Date(active.start).toLocaleTimeString("cs-CZ", { hour: "2-digit", minute: "2-digit" })})`),
            e("button", { onClick: onEnd, className: "w-full py-3 rounded-xl bg-red-500 text-white font-bold text-sm shadow-lg" }, "Ukončit směnu")
          ) : e("div", { className: "space-y-3" },
            e("p", { className: "text-xs font-bold text-gray-400 uppercase" }, "Vyberte objekt pro novou směnu:"),
            e("select", { value: selectedArea, onChange: e => setSelectedArea(e.target.value), className: "w-full p-2.5 rounded-xl bg-[#2E3338] border border-[#3A3F44] text-sm text-white outline-none" },
              AREAS.map(a => e("option", { key: a.id, value: a.id }, a.label))
            ),
            e("button", { onClick: () => onStart(selectedArea), className: "w-full py-3 rounded-xl bg-[#F2A93B] text-black font-bold text-sm shadow-lg" }, "Zahájit směnu")
          )
        ),

        e("div", { className: "grid grid-cols-2 gap-4" },
          e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44] text-center" },
            e("p", { className: "text-xs text-gray-400 uppercase font-bold" }, "Odpracováno"),
            e("p", { className: "text-2xl font-bold text-[#F2A93B] mt-1" }, `${totalHours} hod`)
          ),
          e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44] text-center" },
            e("p", { className: "text-xs text-gray-400 uppercase font-bold" }, "Celková výplata"),
            e("p", { className: "text-2xl font-bold text-green-400 mt-1" }, `${totalWage} Kč`)
          )
        ),

        e("div", { className: "bg-[#24282C] p-4 rounded-2xl border border-[#3A3F44]" },
          e("h2", { className: "text-xs font-bold uppercase tracking-wider text-gray-400 mb-3" }, "Přehled odpracovaných směn"),
          sessions.length === 0 ? e("p", { className: "text-sm text-gray-500 italic" }, "Zatím nebyla zaznamenána žádná směna.") :
          sessions.map(s => e("div", { key: s.id, className: "flex justify-between items-center p-3 mb-2 rounded-xl bg-[#2E3338] border border-[#3A3F44]" },
            e("div", null,
              e("p", { className: "text-sm font-bold text-gray-200" }, `${s.date} ${s.end ? "" : "(Probíhá…)"}`),
              e("p", { className: "text-xs text-gray-400" }, `Místo: ${(AREAS.find(a=>a.id===s.area)||{}).label || s.area}`),
              s.hours && e("p", { className: "text-xs text-green-400 font-semibold mt-0.5" }, `${s.hours} hod × ${s.rate} Kč/h = ${s.wage} Kč`)
            ),
            s.end && e("button", { onClick: () => onDelete(s.id), className: "text-gray-500 hover:text-red-400 text-xs px-2 py-1" }, "Smazat")
          ))
        )
      );
    }

    // Spuštění Reactu
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
